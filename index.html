<body>
<div class="app">
  <aside id="side"><div class="brand"><div class="logo">📈</div>Mój portfel</div><nav class="nav" id="nav"></nav><div style="font-size:11px;color:#6f86a8;padding:16px 10px 4px">wersja 2026-11-09 22:01</div></aside>
  <main>
    <div class="top">
      <button class="btn ghost menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h1 id="title"></h1>

<script>
/* ===================== SILNIK OBLICZEŃ ===================== */
const EPS = 1e-9;
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const num = v => { if (v === '' || v === null || v === undefined) return 0; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const has = v => v !== '' && v !== null && v !== undefined && !(typeof v === 'number' && isNaN(v));
const ymd = d => { const x = new Date(d); return isNaN(x) ? '' : x.toISOString().slice(0, 10); };
const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

function defaultState() {
  return {
    strategie: [
      { id: 's1', nazwa: 'Długi termin', konto: 'XTB USD', kapital: '', opis: 'ETF-y na lata', kolor: '#1565C0' },
      { id: 's2', nazwa: 'Dywidendowa', konto: 'XTB USD', kapital: '', opis: '', kolor: '#26A69A' },
      { id: 's3', nazwa: 'IKE', konto: 'XTB IKE', kapital: '', opis: '', kolor: '#7E57C2' },
      { id: 's4', nazwa: 'Metale', konto: 'Sejf', kapital: '', opis: 'Kruszce fizyczne', kolor: '#F9A825' },
      { id: 's5', nazwa: 'Krypto', konto: 'Krypto', kapital: '', opis: '', kolor: '#EF5350' },
    ],
    konta: [
      { id: 'k1', nazwa: 'XTB USD', typ: 'Opodatkowane', waluta: 'USD', gotowka: '', model: 'TAK' },
      { id: 'k2', nazwa: 'XTB PLN', typ: 'Opodatkowane', waluta: 'PLN', gotowka: '', model: 'TAK' },
      { id: 'k3', nazwa: 'XTB IKE', typ: 'IKE', waluta: 'PLN', gotowka: '', model: 'TAK' },
      { id: 'k4', nazwa: 'Sejf', typ: 'Poza PIT-38', waluta: 'PLN', gotowka: '', model: 'TAK' },
      { id: 'k5', nazwa: 'Obligacje skarbowe', typ: 'Poza PIT-38', waluta: 'PLN', gotowka: '', model: 'TAK' },
      { id: 'k6', nazwa: 'Krypto', typ: 'Opodatkowane', waluta: 'USD', gotowka: '', model: 'TAK' },
    ],
    instrumenty: [
      { id: 'i1', ticker: 'CSPX', nazwa: 'iShares Core S&P 500 (Acc)', klasa: 'Akcje/ETF', koszyk: 'CSPX', waluta: 'USD', cena: '', dataCeny: '', symbol: 'LON:CSPX', cenaAuto: '' },
      { id: 'i2', ticker: 'IWDA', nazwa: 'iShares Core MSCI World (Acc)', klasa: 'Akcje/ETF', koszyk: 'IWDA', waluta: 'USD', cena: '', dataCeny: '', symbol: 'LON:IWDA', cenaAuto: '' },
      { id: 'i3', ticker: 'IB01', nazwa: 'iShares $ Treasury Bond 0-1yr', klasa: 'Obligacje', koszyk: 'IB01', waluta: 'USD', cena: '', dataCeny: '', symbol: 'LON:IB01', cenaAuto: '' },
      { id: 'i4', ticker: 'ZŁOTO', nazwa: 'Złoto fizyczne (1 oz)', klasa: 'Złoto', koszyk: 'ZŁOTO', waluta: 'USD', cena: '', dataCeny: '', symbol: 'YAHOO:GC=F', cenaAuto: '' },
      { id: 'i5', ticker: 'SREBRO', nazwa: 'Srebro fizyczne (1 oz)', klasa: 'Srebro', koszyk: 'SREBRO', waluta: 'USD', cena: '', dataCeny: '', symbol: 'YAHOO:SI=F', cenaAuto: '' },
      { id: 'i6', ticker: 'BTC', nazwa: 'Bitcoin', klasa: 'Krypto', koszyk: 'BTC', waluta: 'USD', cena: '', dataCeny: '', symbol: 'YAHOO:BTC-USD', cenaAuto: '' },
    ],
    transakcje: [], dywidendy: [], wplaty: [], inflacja: [], historia: [],
    alerty: [],
    cele: [
      { id: 'c1', konto: '', koszyk: 'CSPX', tickery: 'CSPX', grupa: 'CORE', cel: 39 }, { id: 'c2', konto: '', koszyk: 'IWDA', tickery: 'IWDA', grupa: 'CORE', cel: 26 },
      { id: 'c3', konto: '', koszyk: 'IB01', tickery: 'IB01', grupa: 'STABILIZATORY', cel: 17 }, { id: 'c4', konto: '', koszyk: 'ZŁOTO', tickery: 'ZŁOTO', grupa: 'STABILIZATORY', cel: 6 },
      { id: 'c5', konto: '', koszyk: 'SREBRO', tickery: 'SREBRO', grupa: 'STABILIZATORY', cel: 4 }, { id: 'c6', konto: '', koszyk: 'BTC', tickery: 'BTC', grupa: 'ASYMETRIA', cel: 8 },
    ],
    ustawienia: { kursy: { USD: '', EUR: '', GBP: '', CHF: '' }, kursyData: '', stawka: 19 },
  };
}

/* indeks inflacji: miesiąc 'YYYY-MM' -> poziom cen na koniec miesiąca (start = 1) */
function inflIndex(inflacja, pole = 'mm') {
  const rows = (inflacja || []).filter(r => r.miesiac && has(r[pole])).sort((a, b) => a.miesiac.localeCompare(b.miesiac));
  const idx = []; let lvl = 1;
  for (const r of rows) { lvl *= 1 + num(r[pole]) / 100; idx.push([r.miesiac, lvl]); }
  const at = (ym) => { let v = 1; for (const [m, l] of idx) { if (m <= ym) v = l; else break; } return v; };
  const prevMonth = (d) => { const x = new Date(d + 'T00:00:00'); x.setDate(0); return x.toISOString().slice(0, 7); };
  return {
    now: idx.length ? idx[idx.length - 1][1] : 1,
    lastMonth: idx.length ? idx[idx.length - 1][0] : '',
    before: (dateStr) => at(prevMonth(dateStr)),       // poziom cen przed danym dniem (koniec poprzedniego miesiąca)
    atDate: (dateStr) => at(prevMonth(dateStr)),
  };
}

/* opts.waluta – waluta prezentacji (PLN/USD/EUR); opts.fx – kursy historyczne NBP { USD: [[data, kurs], …] }.
   Kwoty „PLN” w wynikach prezentacyjnych to równowartość kwoty w walucie prezentacji po dzisiejszym kursie,
   więc formatowanie dzieli je przez bieżący kurs i dostaje kwotę liczoną po kursach historycznych.
   Podatki (T, podatki()) zawsze w prawdziwych złotych. */
const INFL_POLE = { PLN: 'mm', USD: 'mmUS', EUR: 'mmEA' };
function calc(S, opts = {}) {
  const rates = S.ustawienia.kursy || {};
  const rateNow = cur => (!cur || cur === 'PLN') ? 1 : num(rates[cur]);
  const X = (opts.waluta && opts.waluta !== 'PLN' && rateNow(opts.waluta)) ? opts.waluta : 'PLN';
  const fxRows = (opts.fx || {})[X] || [];
  const fxAt = d => {   // kurs NBP z ostatniego dnia roboczego przed d (jak D-1); brak danych -> kurs bieżący
    if (X === 'PLN') return 1; if (!fxRows.length || !d) return rateNow(X);
    d = String(d).slice(0, 10); let lo = 0, hi = fxRows.length - 1;
    if (fxRows[0][0] >= d) return fxRows[0][1];
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (fxRows[m][0] < d) lo = m; else hi = m - 1; }
    return fxRows[lo][1];
  };
  // kwota w PLN z dnia d -> równowartość w walucie prezentacji (po kursie z d), wyrażona po dzisiejszym kursie
  const hx = (plnAmt, d, cur, amtCur) => X === 'PLN' ? plnAmt : (cur === X && amtCur !== undefined ? amtCur * rateNow(X) : plnAmt / fxAt(d) * rateNow(X));
  const instr = {}; S.instrumenty.forEach(i => { if (i.ticker) instr[i.ticker] = i; });
  const strat = {}; S.strategie.forEach(s => { strat[s.nazwa] = s; });
  const konto = {}; S.konta.forEach(k => { konto[k.nazwa] = k; });
  const curOf = t => (instr[t] && instr[t].waluta) || 'USD';
  const priceOf = t => { const i = instr[t]; if (!i) return 0; return has(i.cena) ? num(i.cena) : num(i.cenaAuto); };
  const warnings = [];

  const txs = S.transakcje.filter(t => t.data && t.ticker && t.typ && num(t.ilosc) > 0)
    .map((t, n) => ({ ...t, _n: n })).sort((a, b) => (a.data === b.data ? a._n - b._n : a.data.localeCompare(b.data)));

  // wybrany=true: sprzedaż z polem „zakup” zamyka najpierw ten konkretny zakup (widok pozycji);
  // podatek zawsze liczony FIFO – tak wymaga ustawa o PIT
  function fifo(keyFn, wybrany, conv = false) {
    const cv = (pln, d, cur, amt) => conv ? hx(pln, d, cur, amt) : pln;
    const lots = {}, realized = [];
    for (const t of txs) {
      const cur = curOf(t.ticker), q = num(t.ilosc), p = num(t.cena), fee = num(t.prowizja);
      const kursOk = cur === 'PLN' || has(t.kurs);
      const kurs = cur === 'PLN' ? 1 : (has(t.kurs) ? num(t.kurs) : rateNow(cur));
      const key = keyFn(t);
      if (!lots[key]) lots[key] = [];
      if (t.typ === 'KUPNO') {
        const cost = q * p + fee;
        lots[key].push({ q, q0: q, cena: p, uc: cost / q, ucPLN: cv(cost * kurs, t.data, cur, cost) / q, ucPLNr: cost * kurs / q, data: t.data, id: t.id, kursOk });
      } else if (t.typ === 'SPRZEDAŻ') {
        let left = q, cost = 0, costPLN = 0, allOk = kursOk, firstBuy = null; const uzyte = [];
        const bierz = lot => { const take = Math.min(left, lot.q);
          cost += take * lot.uc; costPLN += take * lot.ucPLN; if (!lot.kursOk) allOk = false; if (!firstBuy || lot.data < firstBuy) firstBuy = lot.data;
          uzyte.push({ id: lot.id, data: lot.data, q: take, cena: lot.cena, uc: lot.uc }); lot.q -= take; left -= take; };
        if (wybrany && t.zakup) { const lot = lots[key].find(l => l.id === t.zakup); if (lot) bierz(lot); }
        while (left > EPS && lots[key].some(l => l.q > EPS)) bierz(lots[key].find(l => l.q > EPS));

      nettoPLN: hx(bruttoPLN - podatekPLN, d.data, cur, num(d.brutto) - num(d.podatek)), nettoPLNprawdziwe: bruttoPLN - podatekPLN, doplata, rok: +d.data.slice(0, 4), typ };

      niezreal: w - k, niezrealPct: k ? (w - k) / k : 0, zrealizowany: zr, dywidendyNetto: dn, wynik: w - k + zr + dn,
      wolne: has(s.kapital) ? num(s.kapital) - kosztWal + zrWal + dnWal : null,

  // konta
  const konta = S.konta.map(k => {
    const w = sumPLN(pozycje.filter(p => p.konto === k.nazwa), p => p.wartoscPLN);

  const wModelu = p => ((konto[p.konto] || {}).model || 'TAK') !== 'NIE';

/* ===================== WYKRESY SVG ===================== */
const PAL = ['#1565C0', '#26A69A', '#F9A825', '#7E57C2', '#EF5350', '#8D6E63', '#78909C', '#AB47BC', '#29B6F6', '#9CCC65'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtShort = v => { const a = Math.abs(v); if (a >= 1e6) return (v / 1e6).toFixed(1).replace('.', ',') + ' mln'; if (a >= 1e4) return Math.round(v / 1e3) + ' tys.'; if (a >= 1e3) return (v / 1e3).toFixed(1).replace('.', ',') + ' tys.'; if (a >= 100 || a === 0) return Math.round(v).toString(); return (+v.toFixed(a >= 10 ? 1 : 2)).toString().replace('.', ','); };
function niceTicks(min, max, n = 5) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
  return t;
}
function emptyChart(msg) { return `<div class="chart-empty">${esc(msg || 'Brak danych do wykresu')}</div>`; }

/* series: [{name, color, points:[[dateStr, value]]}], opts: {pct, h} */
function lineChart(series, opts = {}) {
  const K = (!opts.pct && !opts.fmt && !opts.pln && typeof C !== 'undefined' && C && C.waluta && C.waluta !== 'PLN' && C.kursX) ? C.kursX : 1;   // waluta prezentacji
  if (K !== 1) series = series.map(s => ({ ...s, points: s.points.map(p => [p[0], p[1] / K]) }));
  const pts = series.flatMap(s => s.points);
  if (pts.length < 2) return emptyChart(opts.empty || 'Wykres pojawi się po kilku dniach zapisów historii');
  const W = 640, H = opts.h || 240, L = 66, R = 14, T = 12, B = 28;
  const xs = pts.map(p => new Date(p[0]).getTime()), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (!opts.pct && opts.zero !== false) y0 = Math.min(y0, 0);
  if (y1 - y0 < Math.abs(y1) * 0.002) { const pad = Math.max(Math.abs(y1) * 0.002, 1); y0 -= pad; y1 += pad; }
  const ticks = niceTicks(y0, y1); y0 = ticks[0]; y1 = ticks[ticks.length - 1];
  const X = t => L + (W - L - R) * (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0));
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const stepT = ticks.length > 1 ? Math.abs(ticks[1] - ticks[0]) : 1;
  const fy = v => opts.pct ? (v * 100).toFixed(stepT < 0.01 ? 1 : 0).replace('.', ',') + '%' : (stepT < 1000 && Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('pl-PL') : fmtShort(v));
  let g = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${fy(v)}</text>`).join('');
  const span = x1 - x0, p2 = n => String(n).padStart(2, '0');
  const fx = d => span < 2 * 864e5 ? `${p2(d.getHours())}:${p2(d.getMinutes())}` : span < 120 * 864e5 ? `${p2(d.getDate())}.${p2(d.getMonth() + 1)}` : `${p2(d.getMonth() + 1)}.${String(d.getFullYear()).slice(2)}`;
  const nx = 5; for (let i = 0; i <= nx; i++) { const t = x0 + (x1 - x0) * i / nx; const d = new Date(t);
    g += `<text x="${X(t)}" y="${H - 8}" class="ax" text-anchor="middle">${fx(d)}</text>`; }
  const paths = series.map((s, k) => { const c = s.color || PAL[k];
    const sorted = s.points.slice().sort((a, b) => a[0].localeCompare(b[0]));
    const d = sorted.map((p, i) => `${i ? 'L' : 'M'}${X(new Date(p[0]).getTime()).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    const area = k === 0 && opts.area ? `<path d="${d}L${X(new Date(sorted[sorted.length - 1][0]).getTime())},${Y(y0)}L${X(new Date(sorted[0][0]).getTime())},${Y(y0)}Z" fill="${c}" opacity=".08"/>` : '';
    return area + `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>`; }).join('');
  const zero = !opts.pct || y0 >= 0 ? '' : `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#9aa4b2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}${zero}${paths}</svg>` + legend(series.map((s, k) => [s.name, s.color || PAL[k]]));
}
function legend(items) { return `<div class="legend">${items.map(([n, c]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`; }

/* data: [[label, value]] */
function donut(data, opts = {}) {
  data = data.filter(d => d[1] > 0).sort((a, b) => b[1] - a[1]);
  const tot = data.reduce((a, d) => a + d[1], 0);
  if (!tot) return emptyChart(opts.empty);
  const R = 80, r = 52, C = 100; let a0 = -Math.PI / 2, out = '';
  data.forEach(([, v], k) => {
    const a1 = a0 + 2 * Math.PI * v / tot, big = a1 - a0 > Math.PI ? 1 : 0, c = opts.colors?.[k] || PAL[k % PAL.length];
    if (data.length === 1) { out += `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="${c}" stroke-width="${R - r}"/>`; }
    else { const p = (ang, rad) => `${(C + rad * Math.cos(ang)).toFixed(2)},${(C + rad * Math.sin(ang)).toFixed(2)}`;
      out += `<path d="M${p(a0, R)}A${R},${R} 0 ${big} 1 ${p(a1, R)}L${p(a1, r)}A${r},${r} 0 ${big} 0 ${p(a0, r)}Z" fill="${c}"/>`; }
    a0 = a1; });
  const center = opts.center ? `<text x="${C}" y="${C - 2}" text-anchor="middle" class="dc1">${esc(opts.center[0])}</text><text x="${C}" y="${C + 16}" text-anchor="middle" class="dc2">${esc(opts.center[1])}</text>` : '';
  const leg = data.map(([n, v], k) => `<div class="dl"><i style="background:${opts.colors?.[k] || PAL[k % PAL.length]}"></i><span>${esc(n)}</span><b>${(v / tot * 100).toFixed(1).replace('.', ',')}%</b></div>`).join('');
  return `<div class="donut"><svg viewBox="0 0 200 200">${out}${center}</svg><div class="dlegend">${leg}</div></div>`;
}

/* bars: labels[], series:[{name,color,values[]}], opts {h, fmt, horizontal} */
function barChart(labels, series, opts = {}) {
  const K = (!opts.pct && !opts.fmt && !opts.pln && typeof C !== 'undefined' && C && C.waluta && C.waluta !== 'PLN' && C.kursX) ? C.kursX : 1;
  if (K !== 1) series = series.map(s => ({ ...s, values: s.values.map(v => v / K) }));
  const all = series.flatMap(s => s.values);
  if (!all.some(v => v)) return emptyChart(opts.empty);
  const W = 640, H = opts.h || 230, L = 58, R = 12, T = 12, B = 30;
  let y0 = Math.min(0, ...all), y1 = Math.max(0, ...all); const ticks = niceTicks(y0, y1); y0 = ticks[0]; y1 = ticks[ticks.length - 1];
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const n = labels.length, gw = (W - L - R) / n, bw = Math.min(28, gw * 0.7 / series.length);
  const f = opts.fmt || fmtShort;
  let g = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${f(v)}</text>`).join('');
  labels.forEach((lb, i) => { const cx = L + gw * (i + 0.5);
    g += `<text x="${cx}" y="${H - 10}" class="ax" text-anchor="middle">${esc(String(lb).slice(0, 12))}</text>`;
    series.forEach((s, k) => { const v = s.values[i] || 0, x = cx - bw * series.length / 2 + k * bw, y = Y(Math.max(v, 0)), h = Math.abs(Y(v) - Y(0));
      const col = opts.signColors ? (v >= 0 ? '#26A69A' : '#EF5350') : (s.color || PAL[k]);
      g += `<rect x="${x + 1}" y="${y}" width="${bw - 2}" height="${Math.max(h, v ? 1 : 0)}" rx="3" fill="${col}"><title>${esc(lb)}: ${esc(f(v))}</title></rect>`; }); });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>` + (series.length > 1 ? legend(series.map((s, k) => [s.name, s.color || PAL[k]])) : '');
}

function toRows(name) {
  const T = TABLES[name];
  let list;
  if (name === 'ustawienia') {
    const u = S.ustawienia; list = [{ klucz: 'stawka', wartosc: u.stawka }, { klucz: 'kursyData', wartosc: u.kursyData || '' },
      ...Object.entries(u.kursy || {}).map(([k, v]) => ({ klucz: 'kurs_' + k, wartosc: v }))];
  } else list = S[name] || [];
  const cell = (k, v) => { if (k === 'cenaAuto') return ''; v = v ?? ''; if (typeof v === 'string' && !['id', 'miesiac', 'data', 'dataCeny', 'klucz', 'ticker', 'nazwa'].includes(k) && /^-?\d+(\.\d+)?$/.test(v.trim())) return Number(v); return v; };
  return [T.cols.map(c => c[1]), ...list.map(o => T.cols.map(([k]) => cell(k, o[k])))];
}
function fromRows(name, rows) {
  const T = TABLES[name]; if (!rows || !rows.length) return null;
  const head = rows[0].map(h => String(h).trim());
  const idx = T.cols.map(([k, lab]) => head.indexOf(lab));
  const objs = rows.slice(1).filter(r => r.some(v => v !== '' && v !== null)).map(r => {
    const o = {}; T.cols.forEach(([k], i) => { let v = idx[i] >= 0 ? r[idx[i]] : ''; if (v === undefined || v === null) v = '';
      if ((k === 'data' || k === 'dataCeny') && typeof v === 'number') v = new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
      o[k] = v; });
    if ('id' in o && !o.id) o.id = uid();
    return o; });
  if (name === 'ustawienia') {
    const u = { kursy: {}, kursyData: '', stawka: 19 };
    objs.forEach(o => { if (o.klucz === 'stawka') u.stawka = num(o.wartosc) || 19; else if (o.klucz === 'kursyData') u.kursyData = String(o.wartosc);
      else if (String(o.klucz).startsWith('kurs_')) u.kursy[o.klucz.slice(5)] = o.wartosc; });
    return u;
  }
  return objs;
}

/* ---------- formuła ceny w arkuszu ----------
   YAHOO:GC=F  -> =YAHOO("GC=F|<data>")  (funkcja ze skryptu Portfel_Ceny.gs; data po „|” wymusza odświeżenie raz dziennie)
   =COKOLWIEK  -> wpisane wprost jako formuła
   inne        -> =GOOGLEFINANCE("SYMBOL") */
function priceFormula(sym, day) {
  sym = String(sym || '').trim(); if (!sym) return '';
  if (sym.startsWith('=')) return sym;
  if (/^YAHOO:/i.test(sym)) return `=YAHOO("${sym.slice(6).replace(/"/g, '')}|${day}")`;   // jeden argument – bez separatora
  return `=GOOGLEFINANCE("${sym.replace(/"/g, '')}")`;
}

// arkusz utworzony przez aplikację -> drive.file (dostęp tylko do niego); własny arkusz użytkownika -> spreadsheets
const scopeNow = () => (CFG.sheetId && !CFG.createdByApp) ? 'https://www.googleapis.com/auth/spreadsheets' : 'https://www.googleapis.com/auth/drive.file';
let tokenClient = null;
function setSync(state, msg) { SYNC.state = state; SYNC.msg = msg; if (typeof renderSyncBadge === 'function') renderSyncBadge(); }
function loadGis() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => res(); s.onerror = () => rej(new Error('Nie udało się wczytać logowania Google (brak internetu lub blokada).'));
    document.head.appendChild(s);
  });
}
async function googleConnect(interactive = true) {
  if (!CFG.clientId) { setSync('local', 'Wpisz Client ID w Ustawieniach, aby połączyć z Google'); return false; }
  try { await loadGis(); } catch (e) { setSync('error', e.message); return false; }
  return new Promise(resolve => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CFG.clientId, scope: scopeNow(),
      callback: async (resp) => {
        if (resp.error) { setSync('error', 'Logowanie przerwane: ' + resp.error); return resolve(false); }
        SYNC.token = resp.access_token; SYNC.exp = Date.now() + (resp.expires_in - 60) * 1000;
        CFG.connected = true; saveCfg();
        try { await afterLogin(); resolve(true); } catch (e) { setSync('error', 'Błąd synchronizacji: ' + e.message); resolve(false); }
      },
      error_callback: (e) => { setSync('error', 'Logowanie Google: ' + (e.message || e.type)); resolve(false); },
    });
    tokenClient.requestAccessToken({ prompt: interactive && !CFG.connectedOnce ? 'consent' : '' });
  });
}
function googleDisconnect() {
  try { if (SYNC.token && window.google) google.accounts.oauth2.revoke(SYNC.token, () => {}); } catch (e) {}
  SYNC.token = null; CFG.connected = false; saveCfg(); setSync('local', 'Rozłączono – dane tylko w tej przeglądarce');
}
async function ensureToken() { return !!(SYNC.token && Date.now() < SYNC.exp); }
async function gapi(method, url, body) {
  const r = await fetch(url, { method, headers: { Authorization: 'Bearer ' + SYNC.token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { SYNC.token = null; throw new Error('Sesja Google wygasła – zaloguj się ponownie'); }
  if (!r.ok) { let t = ''; try { t = (await r.json()).error.message; } catch (e) {} throw new Error(`Google API ${r.status} ${t}`); }
  return r.json();
}

/* ---------- zakładka „Podsumowanie” w arkuszu (formuły – działa bez aplikacji) ---------- */
async function detectSep() {

  const sep = (r.values && r.values[0] && r.values[0][0] === 3) ? ',' : ';';

function summarySig() {
  const pairs = [...new Set(S.transakcje.map(t => t.strategia + '|' + t.ticker))].sort();
  return JSON.stringify([pairs, S.strategie.map(s => s.nazwa), S.konta.map(k => k.nazwa), S.instrumenty.map(i => i.ticker), S.cele.map(c => [c.konto, c.koszyk, c.tickery, c.cel]), (S.alerty || []).map(a => [a.id, a.aktywny, a.typ, a.ticker, a.konto, a.koszyk, a.poziom, a.notatka, a.srednia]), [...new Set(S.wplaty.map(w => String(w.data).slice(0, 4)))].sort(), new Date().getFullYear(), 5]);

async function buildSummary(force) {
  if (CFG.demo) throw new Error('W trybie demo arkusz nie jest zmieniany');

  const sig = summarySig(); if (!force && CFG.sumSig && CFG.sumSig[CFG.sheetId] === sig) return;
  const SEP = await detectSep();
  const f = x => x.replace(/§/g, SEP);
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const pairs = [...new Set(S.transakcje.filter(t => t.strategia && t.ticker).map(t => t.strategia + '|' + t.ticker))].sort().map(p => p.split('|'));
  const strat = S.strategie.map(s => s.nazwa), konta = S.konta, instr = S.instrumenty.filter(i => i.ticker);
  const N = 3000, T = (c) => `Transakcje!$${c}$2:$${c}$${N}`;

  // --- pomocnicza tabela strategia × instrument (kolumny T:AC) ---
  const H0 = 2, HL = Math.max(H0, H0 + pairs.length - 1);
  const help = [['Strategia', 'Ticker', 'Ilość', 'Cena', 'Kurs', 'Waluta', 'Wartość PLN', 'Koszt PLN', 'Konto', 'Klasa']];
  pairs.forEach(([st, tk], i) => { const r = H0 + i, m = `MATCH($U${r}§Instrumenty!$B:$B§0)`;
    help.push([st, tk,
      f(`=SUMIFS(Transakcje!$F:$F§Transakcje!$C:$C§$T${r}§Transakcje!$E:$E§$U${r}§Transakcje!$D:$D§"KUPNO")-SUMIFS(Transakcje!$F:$F§Transakcje!$C:$C§$T${r}§Transakcje!$E:$E§$U${r}§Transakcje!$D:$D§"SPRZEDAŻ")`),

/* ===================== ANALITYKA ===================== */
const DAY = 864e5;
const dnum = d => new Date(String(d).slice(0, 10) + 'T12:00:00').getTime();

/* XIRR: flows = [[dataStr, kwota]] (wpłata ujemna, wartość końcowa dodatnia) -> stopa roczna */
function xirr(flows) {
  flows = flows.filter(f => f[1] && isFinite(f[1])).sort((a, b) => dnum(a[0]) - dnum(b[0]));
  if (flows.length < 2 || !flows.some(f => f[1] > 0) || !flows.some(f => f[1] < 0)) return null;
  const t0 = dnum(flows[0][0]);
  if ((dnum(flows[flows.length - 1][0]) - t0) / DAY < 1) return null;
  const npv = r => flows.reduce((a, [d, v]) => a + v / Math.pow(1 + r, (dnum(d) - t0) / DAY / 365), 0);
  let lo = -0.99, hi = 10, flo = npv(lo), fhi = npv(hi);
  if (flo * fhi > 0) return null;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2, fm = npv(mid); if (Math.abs(fm) < 1e-7) return mid; if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; } }
  return (lo + hi) / 2;
}
function xirrPortfel(SV, CV) {
  const fl = SV.wplaty.filter(w => w.data && has(w.kwotaPLN)).map(w => [w.data, -(CV.depX ? CV.depX(w) : num(w.kwotaPLN))]);
  fl.push([todayStr(), CV.wartosc]);
  return xirr(fl);
}
function xirrStrategia(SV, CV, s) {
  const fl = [];
  CV.zamkniete.filter(r => r.strategia === s.nazwa).forEach(r => fl.push([r.data, r.przychodPLN]));
  SV.transakcje.filter(t => t.strategia === s.nazwa && t.typ === 'KUPNO' && t.data).forEach(t => {
    const cur = (SV.instrumenty.find(i => i.ticker === t.ticker) || {}).waluta || 'USD';
    const kurs = cur === 'PLN' ? 1 : (has(t.kurs) ? num(t.kurs) : CV.rateNow(cur));
    const amt = num(t.ilosc) * num(t.cena) + num(t.prowizja); fl.push([t.data, -(CV.hx ? CV.hx(amt * kurs, t.data, cur, amt) : amt * kurs)]); });
  CV.dyw.filter(d => d.strategia === s.nazwa).forEach(d => fl.push([d.data, d.nettoPLN]));
  if (s.wartosc) fl.push([todayStr(), s.wartosc]);
  return xirr(fl);
}

/* historia -> stopy okresowe (TWR), indeks bez wpływu wpłat, obsunięcie */
function histPoints(SV, CV = C) {   // w walucie prezentacji: wartość po kursie z danego dnia, kapitał z wpłat po kursach z dni wpłat
  const pln = !CV || !CV.waluta || CV.waluta === 'PLN';
  return SV.historia.filter(x => x.data && has(x.wartosc)).map(x => { const d = String(x.data).slice(0, 10);
    return { d, w: pln ? num(x.wartosc) : CV.histX(num(x.wartosc), d), k: pln ? num(x.kapital) : CV.kapitalNa(d) }; })
    .sort((a, b) => a.d.localeCompare(b.d));
}
function twrIndex(pts) {
  const out = []; let I = 1;
  pts.forEach((p, i) => {
    if (i === 0) { out.push({ d: p.d, i: 1 }); return; }
    const prev = pts[i - 1], flow = p.k - prev.k, base = prev.w + flow;
    if (base > 0 && p.w >= 0) I *= p.w / base;
    out.push({ d: p.d, i: I });
  });
  return out;
}
function twrStats(pts) {
  const idx = twrIndex(pts); if (idx.length < 2) return null;
  const tot = idx[idx.length - 1].i - 1, days = (dnum(idx[idx.length - 1].d) - dnum(idx[0].d)) / DAY;
  let peak = 1, maxDD = 0, ddFrom = null, ddTo = null, curPeakD = idx[0].d;
  const dd = idx.map(x => { if (x.i > peak) { peak = x.i; curPeakD = x.d; } const v = x.i / peak - 1; if (v < maxDD) { maxDD = v; ddFrom = curPeakD; ddTo = x.d; } return [x.d, v]; });
  return { tot, roczna: days >= 365 ? Math.pow(1 + tot, 365 / days) - 1 : null, days, dd, maxDD, ddFrom, ddTo, idx, aktualne: dd[dd.length - 1][1] };
}
function monthlyResults(pts) {
  const byM = {}; pts.forEach(p => { byM[p.d.slice(0, 7)] = p; });
  const months = Object.keys(byM).sort(); const out = [];
  months.forEach((m, i) => {
    const end = byM[m], start = i ? byM[months[i - 1]] : pts[0];
    if (!i && start.d === end.d) return;
    const dep = end.k - start.k, zysk = end.w - start.w - dep, base = start.w + Math.max(0, dep) / 2;
    out.push({ m, zysk, pct: base > 0 ? zysk / base : 0 });
  });
  return out;
}

function priceAt(rows, d) {   // ostatnia cena z dnia <= d (lub pierwsza dostępna)
  if (!rows || !rows.length) return null;
  let lo = 0, hi = rows.length - 1; if (d < rows[0][0]) return rows[0][1];
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (rows[mid][0] <= d) lo = mid; else hi = mid - 1; }
  return rows[lo][1];
}
function benchSeries(SV, dates, CV = C) {
  const hx = (v, d) => (CV && CV.waluta && CV.waluta !== 'PLN') ? CV.histX(v, d) : v;
  const wpl = SV.wplaty.filter(w => w.data && has(w.kwotaPLN)).map(w => ({ d: String(w.data).slice(0, 10), v: num(w.kwotaPLN) }));
  if (!wpl.length) return [];
  const fx = (histCache(FX_SYM) || {}).rows;
  const infl = {}; (SV.inflacja || []).forEach(r => { if (has(r.mm)) infl[r.miesiac] = num(r.mm); });
  return BENCH.map(b => {
    let valAt;
    if (!b.sym) {   // EDO: każda wpłata rośnie o inflację + 2% rocznie (miesięcznie)
      const growth = (from, to) => { let f = 1, m = from.slice(0, 7); const end = to.slice(0, 7);
        while (m < end) { const [y, mm] = m.split('-').map(Number); const nx = mm === 12 ? `${y + 1}-01` : `${y}-${String(mm + 1).padStart(2, '0')}`;
          f *= (1 + (infl[m] || 0) / 100) * Math.pow(1.02, 1 / 12); m = nx; } return f; };
      valAt = d => wpl.filter(w => w.d <= d).reduce((a, w) => a + w.v * growth(w.d, d), 0);
    } else {

      const pPLN = d => priceAt(rows, d) * (b.cur === 'USD' ? priceAt(fx, d) : 1);
      const units = wpl.map(w => ({ d: w.d, u: w.v / pPLN(w.d) }));
      valAt = d => units.filter(x => x.d <= d).reduce((a, x) => a + x.u, 0) * pPLN(d);
    }
    return { ...b, points: dates.map(d => [d, hx(valAt(d), d)]), dzis: hx(valAt(todayStr()), todayStr()) };
  });
}

/* wpływ waluty: zysk z ceny instrumentu vs z kursu */
function fxEffect(CV) {
  return CV.pozycje.filter(p => p.waluta !== 'PLN' && p.koszt > 0).map(p => {
    const avgRate = (p.kosztPLNr ?? p.kosztPLN) / p.koszt, now = CV.rateNow(p.waluta);
    return { ...p, avgRate, now, efektCena: (p.wartosc - p.koszt) * avgRate, efektKurs: p.wartosc * (now - avgRate) };

/* koszty: prowizje, podatek u źródła, podatek PIT-38 (szacunek) */
function costs(SV, CV) {
  const byYear = {};
  const add = (y, k, v) => { byYear[y] = byYear[y] || { prowizje: 0, zrodlo: 0, pit: 0 }; byYear[y][k] += v; };
  SV.transakcje.filter(t => t.data && num(t.prowizja)).forEach(t => {
    const cur = (SV.instrumenty.find(i => i.ticker === t.ticker) || {}).waluta || 'USD';
    add(+String(t.data).slice(0, 4), 'prowizje', num(t.prowizja) * (cur === 'PLN' ? 1 : (has(t.kurs) ? num(t.kurs) : CV.rateNow(cur)))); });
  CV.dyw.forEach(d => add(d.rok, 'zrodlo', d.podatekPLN + d.doplata));
  CV.lata.forEach(y => { const P = CV.podatki(y); if (P.podatekPap + P.kPodatek) add(y, 'pit', P.podatekPap + P.kPodatek); });
  return byYear;
}

/* dochód pasywny: ostatnie 12 miesięcy i prognoza */
function passiveIncome(SV, CV) {
  const from = new Date(Date.now() - 365 * DAY).toISOString().slice(0, 10);
  const last = CV.dyw.filter(d => d.data >= from);
  const months = []; for (let i = 11; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(d.toISOString().slice(0, 7)); }
  const byMonth = months.map(m => last.filter(d => d.data.slice(0, 7) === m).reduce((a, d) => a + d.nettoPLN, 0));
  const tickers = [...new Set(last.map(d => d.ticker))].map(t => {
    const sum = last.filter(d => d.ticker === t).reduce((a, d) => a + d.nettoPLN, 0);
    const brutto = last.filter(d => d.ticker === t).reduce((a, d) => a + d.bruttoPLN, 0);
    const poz = CV.pozycje.filter(p => p.ticker === t), koszt = poz.reduce((a, p) => a + p.kosztPLN, 0), wart = poz.reduce((a, p) => a + p.wartoscPLN, 0);
    return { ticker: t, netto: sum, brutto, koszt, wart, yoc: koszt ? brutto / koszt : null, yld: wart ? brutto / wart : null, trzymane: poz.length > 0 };
  }).sort((a, b) => b.netto - a.netto);
  const prognoza = tickers.filter(t => t.trzymane).reduce((a, t) => a + t.netto, 0);
  const nextMonths = months.map(m => { const [y, mm] = m.split('-').map(Number); return `${y + 1}-${String(mm).padStart(2, '0')}`; });
  const fc = months.map(m => last.filter(d => d.data.slice(0, 7) === m && CV.pozycje.some(p => p.ticker === d.ticker)).reduce((a, d) => a + d.nettoPLN, 0));
  return { months, byMonth, tickers, sum12: byMonth.reduce((a, b) => a + b, 0), prognoza, nextMonths, fc };
}

/* symulator przyszłości (procent składany) */
function simulate(o) {
  const r = Math.pow(1 + o.stopa / 100, 1 / 12) - 1, inf = Math.pow(1 + o.inflacja / 100, 1 / 12);
  let V = o.start, dep = o.wplata, wplacone = o.start; const pts = []; let goalM = null;
  for (let m = 0; m <= o.lata * 12; m++) {
    if (m > 0) { V = V * (1 + r) + dep; wplacone += dep; if (m % 12 === 0) dep *= 1 + o.wzrost / 100; }
    const real = V / Math.pow(inf, m);
    if (goalM === null && o.cel > 0 && real >= o.cel) goalM = m;
    pts.push({ m, V, real, wplacone });
  }
  return { pts, goalM };
}

/* mapa portfela (treemap, algorytm squarified) */
function treemap(items, W, H) {
  items = items.filter(i => i.v > 0).sort((a, b) => b.v - a.v);
  const total = items.reduce((a, i) => a + i.v, 0); if (!total) return [];
  const scale = W * H / total; const out = [];
  const nodes = items.map(i => ({ ...i, a: i.v * scale }));
  let x = 0, y = 0, w = W, h = H;
  const worst = (row, side) => { const s = row.reduce((a, n) => a + n.a, 0), mx = Math.max(...row.map(n => n.a)), mn = Math.min(...row.map(n => n.a)); return Math.max(side * side * mx / (s * s), s * s / (side * side * mn)); };
  let row = [];
  const layout = (row) => {
    const s = row.reduce((a, n) => a + n.a, 0);
    if (w >= h) { const cw = s / h; let cy = y; row.forEach(n => { const ch = n.a / cw; out.push({ ...n, x, y: cy, w: cw, h: ch }); cy += ch; }); x += cw; w -= cw; }
    else { const ch = s / w; let cx = x; row.forEach(n => { const cw = n.a / ch; out.push({ ...n, x: cx, y, w: cw, h: ch }); cx += cw; }); y += ch; h -= ch; }
  };
  for (const n of nodes) {
    const side = Math.min(w, h);
    if (!row.length || worst([...row, n], side) <= worst(row, side)) row.push(n);
    else { layout(row); row = [n]; }
  }
  if (row.length) layout(row);
  return out;
}

function emptyMsg() { return { '1d': 'Wykres dzienny pojawi się po kilku aktualizacjach w ciągu dnia (otwórz aplikację ponownie za jakiś czas)', '1w': 'Wykres tygodniowy pojawi się po co najmniej dwóch dniach zapisów' }[RANGE] || 'Wykres pojawi się po kilku dniach zapisów historii'; }
function rangeSeg() { return `<div class="seg">${[['1d', '1D'], ['1w', '1T'], ['1m', '1M'], ['3m', '3M'], ['ytd', 'YTD'], ['1r', '1R'], ['all', 'Całość']].map(([k, l]) => `<button class="${RANGE === k ? 'on' : ''}" onclick="RANGE='${k}';render()">${l}</button>`).join('')}</div>`; }

/* ---------- wycinek danych dla jednego konta (kokpit konta) ---------- */
let CFULL_W = 0; const Cfull_wartosc = () => CFULL_W;
function subsetState(kn) {
  const strat = S.strategie.filter(s => s.konto === kn), names = new Set(strat.map(s => s.nazwa));
  const wpl = S.wplaty.filter(w => w.konto === kn);
  const kapAt = d => wpl.filter(w => String(w.data) <= d).reduce((a, w) => a + num(w.kwotaPLN), 0);
  const hist = S.historia.map(h => { let m = h.konta; try { if (typeof m === 'string') m = m ? JSON.parse(m) : null; } catch (e) { m = null; }
    if (!m || m[kn] === undefined) return null; return { data: h.data, wartosc: m[kn], kapital: kapAt(String(h.data).slice(0, 10)) }; }).filter(Boolean);
  return { ...S, strategie: strat, konta: S.konta.filter(k => k.nazwa === kn).map(k => ({ ...k, model: 'TAK' })),
    transakcje: S.transakcje.filter(t => names.has(t.strategia)), dywidendy: S.dywidendy.filter(d => names.has(d.strategia)),
    wplaty: wpl, historia: hist, cele: S.cele.filter(c => c.konto === kn).map(c => ({ ...c, konto: '' })) };
}

  const opis = { 'Opodatkowane': 'wchodzi do PIT-38', 'IKE': 'bez podatku Belki (IKE)', 'IKZE': 'bez podatku Belki (IKZE)', 'Poza PIT-38': 'nie wchodzi do PIT-38' }[k.typ] || '';
  const struktura = donut(poz.map(p => [p.ticker, p.wartoscPLN]).concat(k.gotowkaPLN ? [['Gotówka', k.gotowkaPLN]] : []), { empty: 'Brak pozycji na tym koncie', center: [nf0.format(k.razem / (C.kursX || 1) / 1000) + ' tys.', WL()] });
  return [k.nazwa, `${esc(k.typ)} · ${esc(opis)} · waluta ${esc(k.waluta)}`, `
    <div class="kpis">${kpi('Wartość konta', zl(k.razem, 0), C.wartosc ? pct(k.razem / C.wartosc) + ' portfela' : '', 'main')}
      ${kpi('Pozycje', zl(k.wartoscPozycji, 0), poz.length + ' otwartych')}
      ${kpi('Gotówka na koncie', `${money(k.gotowkaKwota, k.waluta)}`, (k.gotowkaAuto ? 'liczona: wpłaty − zakupy + sprzedaże + dywidendy' : '<span class="warn">wpisana ręcznie</span>') + (k.waluta !== WAL() ? ' · ≈ ' + zl(k.gotowkaPLN, 0) : '') +
        `<br><a onclick="korektaGotowki('${k.id}')">${k.gotowkaAuto ? 'wpisz saldo ręcznie' : 'wróć do liczenia automatycznego'}</a>`)}
      ${kpi('Wpłacony kapitał', zl(k.kapital, 0), wpl.length + ' wpłat')}
      ${kpi('Zysk / strata', k.zysk === null ? '–' : pl(k.zysk), k.zyskPct === null ? 'dodaj wpłaty, aby policzyć' : pp(k.zyskPct))}</div>
    <div class="grid g2"><div class="card"><h3>Strategie na tym koncie<span class="sp"></span><button class="btn sm ghost" onclick="editStrategiaNaKoncie('${esc(k.nazwa)}')">＋ Strategia</button></h3>${table([
      { h: 'Strategia', f: s => `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${esc(s.kolor)};margin-right:7px"></span>${esc(s.nazwa)}` },
      { h: 'Wartość', n: 1, f: s => zl(s.wartosc, 0) }, { h: 'Wynik', n: 1, f: s => pl(s.wynik) }, { h: '%', n: 1, f: s => pp(s.koszt ? s.wynik / s.koszt : 0) },
    ], strat, { empty: 'Żadna strategia nie jest przypisana do tego konta', click: s => `go('strategia','${s.id}')` })}</div>
      <div class="card"><h3>Struktura konta</h3>${struktura}</div></div>
    <div class="card" style="margin-top:16px"><h3>Portfel docelowy konta</h3>${modelCard(k.nazwa)}</div>
    <div class="grid g2e" style="margin-top:16px"><div class="card"><h3>Pozycje <small>kliknij, aby rozwinąć zakupy</small></h3>${table([
      { h: 'Instrument', f: p => `<b>${esc(p.ticker)}</b> <span class="mut">${esc(p.strategia)}</span>` }, { h: 'Ilość', n: 1, f: p => nfq.format(p.ilosc) },
      { h: 'Wartość ' + WL(), n: 1, f: p => zl(p.wartoscPLN) }, { h: 'Zysk ' + WL(), n: 1, f: p => `${pl(p.zyskPLN)}<br>${pp(p.kosztPLN ? p.zyskPLN / p.kosztPLN : 0)}` }, { h: '', f: pozAkcje },
    ], poz, { empty: 'Brak otwartych pozycji', expand: { key: lotKey, sub: lotSub, cols: [
      { f: l => `${lotOpis(l)} <span class="mut">${esc(l.data)}</span>` }, { n: 1, f: l => nfq.format(l.ilosc) }, { n: 1, f: l => zl(l.wartoscPLN) },
      { n: 1, f: l => `${pl(l.zyskPLN)}<br>${pp(l.kosztPLN ? l.zyskPLN / l.kosztPLN : 0)}` }, { f: lotAkcje }] } })}</div>
      <div class="card"><h3>Wpłaty i wypłaty<span class="sp"></span><button class="btn sm ghost" onclick="editWplata(null,'${esc(k.nazwa)}')">＋ Wpłata</button></h3>${table([
      { h: 'Data', f: w => esc(w.data) }, { h: 'Kwota PLN', n: 1, f: w => plPLN(num(w.kwotaPLN)) },
      { h: 'W walucie konta', n: 1, f: w => has(w.kwotaWal) ? nf2.format(num(w.kwotaWal)) : '–' }, { h: 'Notatka', f: w => esc(w.notatka) },
    ], wpl, { empty: 'Brak wpłat na to konto', click: w => `editWplata('${w.id}')` })}</div></div>`,
    `<button class="btn ghost" onclick="editKonto('${k.id}')">Edytuj / usuń konto</button><button class="btn" onclick="editWplata(null,'${esc(k.nazwa)}')">＋ Wpłata</button>`];

function setGotowka(id, v) { const k = S.konta.find(x => x.id === id); k.gotowka = v === '' ? '' : num(v); changed('konta'); render(); }
function korektaGotowki(id) {
  const k = S.konta.find(x => x.id === id), ck = C.konta.find(x => x.id === id);
  if (has(k.gotowka)) { k.gotowka = ''; changed('konta'); render(); toast('Gotówka liczona automatycznie'); return; }
  const v = prompt(`Saldo gotówki na koncie ${k.nazwa} (${k.waluta}) – np. z XTB.\nWyliczone przez aplikację: ${nf2.format(ck.gotowkaWyliczona)}`, nf2.format(ck.gotowkaWyliczona).replace(/\s/g, ''));
  if (v === null) return; setGotowka(id, String(v).replace(',', '.'));
}
function editStrategiaNaKoncie(konto) { editStrategia(null, konto); }

function modelCard(konto, link = konto) {
  const M = C.modelFor(konto), key = 'nowa_' + (link || '_'), nowa = num(CFG[key]), rozd = M.rozdziel(nowa);
  if (!M.rows.length) return `<div class="empty">Brak portfela docelowego${link ? ' dla tego konta' : ''}.<br><a onclick="FILT.celeKonto='${esc(link)}';go('ustawienia')">Ustaw koszyki i cele →</a></div>`;
  const tbl = table([
    { h: 'Koszyk', f: m => `<b>${esc(m.koszyk)}</b> <span class="mut">${esc(m.grupa || '')}</span>${m.lista.length > 1 || m.lista[0] !== m.koszyk ? `<br><span class="mut" style="font-size:11.5px">${esc(m.lista.join(' + '))}</span>` : ''}` },
    { h: 'Cel', n: 1, f: m => pct(m.celPct) }, { h: 'Teraz', n: 1, f: m => pct(m.udzial) },
    { h: '', f: m => `<div class="bar" style="position:relative"><i style="width:${Math.min(100, m.udzial * 100).toFixed(1)}%;background:#1565c0"></i><b style="position:absolute;top:-3px;left:${Math.min(99, m.celPct * 100)}%;width:2px;height:12px;background:#0f172a"></b></div>` },
    { h: 'Różnica', n: 1, f: m => Math.abs(m.roznica) < 1 ? '<span class="mut">–</span>' : `<span class="${m.roznica > 0 ? 'pos' : 'neg'}">${m.roznica > 0 ? 'dokup ' : 'nadwyżka '}${zl(Math.abs(m.roznica), 0)}</span>` },
    { h: 'Z nowej wpłaty', n: 1, f: m => nowa ? zl(rozd[M.rows.indexOf(m)], 0) : '–' },
  ], M.rows);
  return `<div class="row" style="margin-bottom:8px;font-size:12.5px"><span class="mut">Nowa wpłata do rozdzielenia:</span><input class="cell" type="number" value="${nowa || ''}" placeholder="0 zł" onchange="CFG['${key}']=this.value;saveCfg();render()">
    <span class="sp" style="flex:1"></span><a onclick="FILT.celeKonto='${esc(link)}';go('ustawienia')">edytuj cele</a></div>${tbl}
    <div class="mut" style="font-size:12.5px;margin-top:8px">${M.sumaCel !== 100 ? `<span class="warn">⚠ Suma celów: ${M.sumaCel}% (powinno być 100%)</span> · ` : ''}Poza portfelem docelowym: ${zl(M.poza, 0)} · gotówka: ${zl(M.gotowka, 0)}</div>`;
}

function txCols() {
  return [
    { h: 'Data', f: t => esc(t.data) }, { h: 'Typ', f: t => `<span class="tag ${t.typ === 'KUPNO' ? 'buy' : 'sell'}">${esc(t.typ)}</span>` },
    { h: 'Strategia', f: t => esc(t.strategia) }, { h: 'Ticker', f: t => `<b>${esc(t.ticker)}</b>` },
    { h: 'Ilość', n: 1, f: t => nfq.format(num(t.ilosc)) }, { h: 'Cena', n: 1, f: t => nf2.format(num(t.cena)) },

    { h: 'Kurs NBP', n: 1, f: t => has(t.kurs) ? num(t.kurs).toFixed(4) : (((S.instrumenty.find(i => i.ticker === t.ticker) || {}).waluta || 'USD') === 'PLN' ? '–' : '<span class="warn">brak</span>') },

}
function vTransakcje() {
  const f = FILT.tx || (FILT.tx = { s: '', t: '', r: '' });

    .sort((a, b) => String(b.data).localeCompare(String(a.data)));
  const lata = [...new Set(S.transakcje.map(t => String(t.data).slice(0, 4)))].sort().reverse();
  const sel = (key, label, opts) => `<select onchange="FILT.tx.${key}=this.value;render()"><option value="">${label}</option>${opts.map(o => `<option ${f[key] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  return ['Transakcje', `${rows.length} z ${S.transakcje.length}`, `
    <div class="filters">${sel('s', 'Wszystkie strategie', S.strategie.map(s => s.nazwa))}${sel('t', 'Kupno i sprzedaż', ['KUPNO', 'SPRZEDAŻ'])}${sel('r', 'Wszystkie lata', lata)}</div>

}

function vInflacja() {
  const rows = S.inflacja.slice().sort((a, b) => String(b.miesiac).localeCompare(String(a.miesiac)));
  const asc = rows.slice().reverse();
  const yoy = key => asc.map((r, i) => { if (i < 11) return null; const w = asc.slice(i - 11, i + 1); if (w.some(x => !has(x[key]))) return null;
    return [r.miesiac + '-01', w.reduce((a, x) => a * (1 + num(x[key]) / 100), 1) - 1]; }).filter(Boolean);
  const yPL = yoy('mm'), yUS = yoy('mmUS'), yEA = yoy('mmEA');
  const lastPL = yPL[yPL.length - 1], lastUS = yUS[yUS.length - 1], lastEA = yEA[yEA.length - 1];
  const KRAJ = { PLN: 'PL', USD: 'USA', EUR: 'strefy euro' }[WAL()];
  const yoyMap = (arr) => Object.fromEntries(arr.map(([d, v]) => [d.slice(0, 7), v]));
  const mPL = yoyMap(yPL), mUS = yoyMap(yUS);
  return ['Inflacja', `Pobierana automatycznie raz dziennie z FRED · Polska: Eurostat HICP · USA: BLS CPI-U · strefa euro: Eurostat HICP${CFG.inflDay ? ' · aktualizacja ' + esc(CFG.inflDay) : ''}`, `
    <div class="kpis">${kpi('Inflacja r/r – Polska', lastPL ? pct(lastPL[1]) : '–', lastPL ? lastPL[0].slice(0, 7) : 'brak danych', 'main')}
      ${kpi('Inflacja r/r – USA', lastUS ? pct(lastUS[1]) : '–', lastUS ? lastUS[0].slice(0, 7) : 'brak danych')}
      ${kpi('Inflacja r/r – strefa euro', lastEA ? pct(lastEA[1]) : '–', lastEA ? lastEA[0].slice(0, 7) : 'brak danych')}
      ${kpi(`Wzrost cen (${KRAJ}) od 2015`, pct(C.inflNow - 1), C.inflLast ? 'do ' + C.inflLast : '')}
      ${kpi('Zysk realny portfela', pl(C.zyskRealny), pp(C.zyskRealnyPct) + ` ponad inflację ${KRAJ} (widok w ${WAL()})`)}</div>
    <div class="card"><h3>Inflacja r/r: Polska, USA, strefa euro</h3>${lineChart([{ name: 'Polska', points: yPL, color: '#EF5350' }, { name: 'USA', points: yUS, color: '#1565C0' }, ...(yEA.length ? [{ name: 'Strefa euro', points: yEA, color: '#F9A825' }] : [])], { pct: true, empty: 'Kliknij „Pobierz dane teraz”' })}</div>
    <div style="margin-top:16px"><button class="btn ghost" onclick="FILT.inflTab=!FILT.inflTab;render()">${FILT.inflTab ? '▲ Ukryj dane miesięczne' : '▼ Pokaż dane miesięczne'}</button></div>
    ${!FILT.inflTab ? '' : `<div class="card" style="margin-top:12px"><h3>Dane miesięczne<span class="sp"></span><small>możesz poprawić wartość ręcznie</small></h3>${table([
      { h: 'Miesiąc', f: r => esc(r.miesiac) },
      { h: 'Polska m/m %', n: 1, f: r => `<input class="cell" type="number" step="0.01" value="${esc(r.mm)}" onchange="setInfl('${esc(r.miesiac)}',this.value,'mm')">` },
      { h: 'Polska r/r', n: 1, f: r => mPL[r.miesiac] !== undefined ? pct(mPL[r.miesiac]) : '–' },
      { h: 'USA m/m %', n: 1, f: r => `<input class="cell" type="number" step="0.01" value="${esc(r.mmUS ?? '')}" onchange="setInfl('${esc(r.miesiac)}',this.value,'mmUS')">` },

function modal(title, fields, vals, onSave, onDelete, pre = '') {
  const f = fields.map(x => {
    const v = vals[x.k] ?? '';
    let inp;
    if (x.t === 'select') inp = `<select name="${x.k}">${x.o.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
    else if (x.t === 'textarea') inp = `<textarea name="${x.k}" rows="2">${esc(v)}</textarea>`;
    else inp = `<input name="${x.k}" type="${x.t || 'text'}" ${x.t === 'number' ? 'step="any"' : ''} value="${esc(v)}" ${x.ph ? `placeholder="${esc(x.ph)}"` : ''}>`;
    return `<label class="${x.full ? 'full' : ''}">${x.l}${inp}${x.help ? `<span class="help" id="help_${x.k}">${x.help}</span>` : ''}</label>`;
  }).join('');
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><h2>${esc(title)}</h2>${pre}<form class="form">${f}</form><div class="actions">${onDelete ? '<button class="btn danger" data-a="del">Usuń</button>' : ''}<span class="sp"></span><button class="btn ghost" data-a="cancel">Anuluj</button><button class="btn" data-a="save">Zapisz</button></div></div>`;
  document.body.appendChild(bg);
  const form = bg.querySelector('form');
  const read = () => { const o = {}; fields.forEach(x => { const el = form.elements[x.k]; let v = el.value.trim(); if (x.t === 'number' && v !== '') v = num(v); o[x.k] = v; }); return o; };
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.querySelector('[data-a=cancel]').onclick = close;
  bg.querySelector('[data-a=save]').onclick = () => { const o = read(); const err = onSave(o); if (err) { toast(err); return; } close(); render(); };
  if (onDelete) bg.querySelector('[data-a=del]').onclick = () => { if (confirm('Usunąć?')) { onDelete(); close(); render(); } };
  form.addEventListener('submit', e => e.preventDefault());
  setTimeout(() => { const first = form.querySelector('input,select'); first && first.focus(); }, 30);
  return form;
}
const curOfTicker = t => (S.instrumenty.find(i => i.ticker === t) || {}).waluta || 'USD';
function wireNbp(form, dateKey, tickerKey) {
  const upd = async () => {
    const d = form.elements[dateKey].value, t = form.elements[tickerKey].value, cur = curOfTicker(t), help = form.querySelector('#help_kurs');
    if (cur === 'PLN') { form.elements.kurs.value = ''; help.textContent = 'Instrument w PLN – kurs niepotrzebny'; return; }
    if (!d) return; help.textContent = `Pobieranie kursu ${cur} z NBP…`;
    try { const k = await nbpRate(cur, d); form.elements.kurs.value = k; help.textContent = `Kurs średni NBP ${cur} z dnia roboczego przed ${d}`; }
    catch (e) { help.textContent = 'Nie udało się pobrać kursu – wpisz ręcznie'; }
  };
  form.elements[dateKey].addEventListener('change', upd); form.elements[tickerKey].addEventListener('change', upd);
  if (!form.elements.kurs.value) upd();
}

function heatColor(p) { if (!p) return '#f5f7fa'; const a = Math.min(1, Math.abs(p) / 0.06); return p > 0 ? `rgba(22,163,74,${0.12 + a * 0.6})` : `rgba(220,38,38,${0.12 + a * 0.6})`; }
function kokpitRynek(SV, KK) {
  const pts = histPoints(SV), T = twrStats(pts), xr = xirrPortfel(SV, C);
  // 1. benchmark
  const step = Math.max(1, Math.floor(pts.length / 160)), dates = pts.filter((p, i) => i % step === 0 || i === pts.length - 1).map(p => p.d);
  const B = dates.length > 1 ? benchSeries(SV, dates) : [];
  const brak = B.filter(b => b.brak).length;
  const benchChart = lineChart([{ name: KK ? 'To konto' : 'Mój portfel', points: pts.filter((p, i) => i % step === 0 || i === pts.length - 1).map(p => [p.d, p.w]), color: '#1565C0' },
    { name: 'Wpłacony kapitał', points: dates.map(d => [d, pts.find(p => p.d === d).k]), color: '#94a3b8', dash: true },
    ...B.filter(b => b.points.length).map(b => ({ name: b.label, points: b.points, color: b.color }))], { empty: 'Porównanie pojawi się, gdy będzie historia wartości i wpłaty' });
  const benchTbl = table([
    { h: 'Te same wpłaty w…', f: b => `<i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${b.color};margin-right:7px"></i>${esc(b.label)}` },
    { h: 'Wartość dziś', n: 1, f: b => b.brak ? '<span class="mut">brak notowań</span>' : zl(b.dzis, 0) },
    { h: 'Ty vs on', n: 1, f: b => b.brak ? '–' : pl(C.wartosc - b.dzis) },
  ], B.length ? B : [], { empty: 'Brak wpłat do porównania' });
  // 3. wyniki miesięczne
  const M = monthlyResults(pts), last12 = M.slice(-12);
  const years = [...new Set(M.map(x => x.m.slice(0, 4)))].sort().reverse();
  const heat = years.length ? `<div class="tbl"><table class="heat"><thead><tr><th>Rok</th>${['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'].map(m => `<th class="n">${m}</th>`).join('')}<th class="n">Rok</th></tr></thead><tbody>
    ${years.map(y => { const ym = M.filter(x => x.m.startsWith(y)); const rok = ym.reduce((a, x) => a * (1 + x.pct), 1) - 1;
      return `<tr><td><b>${y}</b></td>${Array.from({ length: 12 }, (_, i) => { const x = ym.find(z => +z.m.slice(5) === i + 1);
        return `<td class="n" style="background:${x ? heatColor(x.pct) : 'transparent'}" title="${x ? esc(zl(x.zysk, 0)) : ''}">${x ? (x.pct * 100).toFixed(1).replace('.', ',') : ''}</td>`; }).join('')}
        <td class="n"><b class="${sgn(rok)}">${(rok * 100).toFixed(1).replace('.', ',')}%</b></td></tr>`; }).join('')}</tbody></table></div>` : '';
  const monthBars = barChart(last12.map(x => x.m.slice(5) + '.' + x.m.slice(2, 4)), [{ name: 'Zysk', values: last12.map(x => x.zysk) }], { signColors: true, empty: 'Wyniki miesięczne pojawią się po pierwszym pełnym miesiącu historii', h: 200 });
  // 4. obsunięcie
  const ddChart = T ? lineChart([{ name: 'Obsunięcie od szczytu', points: T.dd.filter((p, i) => i % step === 0 || i === T.dd.length - 1), color: '#EF5350' }], { pct: true, area: true, h: 190, zero: false }) : emptyChart('Obsunięcie pojawi się, gdy będzie historia wartości');
  const kpis = `<div class="kpis" style="margin-top:16px;margin-bottom:0">
    ${kpi('Roczna stopa zwrotu (XIRR)', xr === null ? '–' : pp(xr), 'uwzględnia terminy wpłat')}
    ${kpi('Stopa zwrotu TWR', T ? pp(T.tot) : '–', T ? (T.roczna !== null ? pp(T.roczna) + ' rocznie' : `za ${Math.round(T.days)} dni (bez wpływu wpłat)`) : 'brak historii')}
    ${kpi('Maks. obsunięcie', T ? `<span class="neg">${pct(T.maxDD)}</span>` : '–', T && T.ddFrom ? `${T.ddFrom} → ${T.ddTo}` : '')}
    ${kpi('Obecnie od szczytu', T ? (T.aktualne > -0.0005 ? '<span class="pos">na szczycie</span>' : `<span class="neg">${pct(T.aktualne)}</span>`) : '–', 'spadek od najwyższej wartości')}</div>`;
  return kpis + `
    <div class="grid g2" style="margin-top:16px"><div class="card"><h3>Porównanie z rynkiem<span class="sp"></span>${SYNC.token && !CFG.demo ? '<button class="btn sm ghost" onclick="odswiezBenchmarki(true)">↻ Notowania</button>' : ''}</h3>${benchChart}
      ${brak ? `<div class="mut" style="font-size:12px;margin-top:6px">${CFG.demo ? 'W trybie demo notowania ETF nie są pobierane – widać tylko EDO.' : 'Notowania ETF i WIG20 pobiorą się po połączeniu z Google Sheets (skrypt Portfel_Ceny.gs z funkcją YAHOO_HIST).'}</div>` : ''}</div>

      <div class="card"><h3>Obsunięcie od szczytu <small>wg stopy TWR</small></h3>${ddChart}</div></div>
    ${heat ? `<div class="card" style="margin-top:16px"><h3>Mapa miesięcy <small>stopa zwrotu w % (najedź, aby zobaczyć kwotę)</small></h3>${heat}</div>` : ''}`;
}

const XH = { type: /^(type|typ)$/i, time: /^(time|czas|data|date)/i, amount: /^(amount|kwota)/i, symbol: /^(symbol|ticker)$/i, name: /^(instrument|nazwa|name)$/i, comment: /^(comment|komentarz|opis)$/i, id: /^(id|nr|numer)$/i };

  const s = String(v || '').trim(); let m;

    if (hi < 0) continue;

    const ci = { type: col('type'), time: col('time'), amount: col('amount'), symbol: col('symbol'), name: col('name'), comment: col('comment'), id: col('id') };
    if (ci.symbol < 0) ci.symbol = ci.name;   // starsze eksporty: jedna kolumna z symbolem
    for (const r of rows.slice(hi + 1)) {

      const m = comment.match(/(OPEN|CLOSE)\s+(BUY|SELL)\s+(?:\S*[A-Za-z]\S*\s+)?([\d.,]+)(?:\s*\/\s*([\d.,]+))?\s*@\s*([\d.,]+)/i); // XTB czasem wstawia ticker: \"OPEN BUY GOOGL.US 1/1.047 @ 286.61\"

async function xtbImportuj() {

    S.instrumenty.push({ id: uid(), ticker: m.ticker, nazwa: m.nazwa || m.ticker, klasa: m.klasa, waluta: m.waluta, cena: '', dataCeny: '', symbol: m.yahoo ? 'YAHOO:' + m.yahoo : '', cenaAuto: '' }); m.nowy = false; } });

      const fee = fees.find(f => !used.has(f) && f.symbol === o.symbol && f.czas.slice(0, 16) === o.czas.slice(0, 16));
      let prow = 0; if (fee) { used.add(fee); prow = Math.abs(fee.amount); if (accCur !== cur) prow = prow * (accCur === 'PLN' ? 1 : await rate(accCur, o.data)) / (kurs || 1); }
      S.transakcje.push({ id: uid(), data: o.data, strategia: m.strategia || defStrat, typ: o.kind === 'buy' ? 'KUPNO' : 'SPRZEDAŻ', ticker: m.ticker, ilosc: o.ilosc, cena: o.cena,
        prowizja: prow ? Math.round(prow * 100) / 100 : '', kurs, notatka: tag }); n.tx++;
    } else if (o.kind === 'div' || o.kind === 'int') {

      const accToCur = async v => accCur === cur ? v : (accCur === 'PLN' ? v / (kurs || 1) : v * (await rate(accCur, o.data)) / (kurs || 1));
      const tx = taxes.filter(t => !used.has(t) && (o.kind === 'div' ? t.kind === 'divtax' && t.symbol === o.symbol : t.kind === 'inttax') && t.data === o.data);
      tx.forEach(t => used.add(t));

      S.dywidendy.push({ id: uid(), data: o.data, strategia: o.kind === 'div' ? (m.strategia || defStrat) : defStrat, ticker: o.kind === 'div' ? m.ticker : '',
        brutto: Math.round(brutto * 100) / 100, podatek: pod ? Math.round(pod * 100) / 100 : '', kurs, notatka: (o.kind === 'int' ? 'Odsetki XTB ' : '') + tag }); n.dyw++;
    } else if (o.kind === 'in' || o.kind === 'out') {

function yahooOf(ticker) {
  const i = S.instrumenty.find(x => x.ticker === ticker) || {}; const s = String(i.symbol || '').trim();
  if (/^YAHOO:/i.test(s)) return s.slice(6);
  if (s.startsWith('=')) return /GOLD/i.test(s) ? 'GC=F' : /SILVER/i.test(s) ? 'SI=F' : '';

    if (ex === 'CURRENCY') return x.length === 6 && /BTC|ETH/.test(x) ? x.slice(0, 3) + '-' + x.slice(3) : x + '=X';
    return x + ({ WSE: '.WA', LON: '.L', ETR: '.DE', FRA: '.DE', AMS: '.AS', EPA: '.PA', BIT: '.MI', SWX: '.SW', TSE: '.TO' }[ex] || ''); }
  return s || ticker || '';
}
const cenaInstr = t => { const i = S.instrumenty.find(x => x.ticker === t); return i ? (has(i.cena) ? num(i.cena) : num(i.cenaAuto)) : 0; };
function sredniaZakupu(ticker, konto) {
  const poz = C.pozycje.filter(p => p.ticker === ticker && (!konto || p.konto === konto)), q = poz.reduce((a, p) => a + p.ilosc, 0);

/* stan alertu: ok / blisko / osiągnięty */
function alertEval(a) {

  const f2 = v => nf2.format(v) + (cur ? ' ' + cur : '');
  if (a.typ === 'KUPNO' || a.typ === 'SPRZEDAŻ') {
    const c = cenaInstr(a.ticker); if (!c || !poziom) return { stan: 'brak', opis: 'brak ceny' };
    const dist = (c / poziom - 1) * 100;   // + powyżej poziomu

      opis: `${(v >= 0 ? '+' : '') + v.toFixed(1).replace('.', ',')}% od średniej ${f2(avg)}`, pp: 1 };
  }

    const M = C.modelFor(a.konto || ''), r = M.rows.find(x => x.koszyk === a.koszyk); if (!r || !M.tot) return { stan: 'brak', opis: 'brak koszyka w portfelu docelowym' };

/* ===================== FIRE: ile brakuje do niezależności finansowej ===================== */
// oczekiwane realne (po inflacji) roczne stopy zwrotu dla klas aktywów – założenia, można nadpisać własną stopą
const FIRE_KLASY = { 'Akcje/ETF': 5, 'Obligacje': 1.5, 'Złoto': 1.5, 'Srebro': 1.5, 'Krypto': 5, 'Gotówka': 0, 'Inne': 3 };

function fireDane() {
  const CP = calcPLN(), f = CFG.fire || {};
  const wykl = new Set(f.wyklucz || []);
  const konta = CP.konta.map(k => ({ ...k, wlicz: !wykl.has(k.nazwa) }));
  const kontaW = konta.filter(k => k.wlicz).map(k => k.nazwa);
  const poz = CP.pozycje.filter(p => kontaW.includes(p.konto));
  const gotowka = konta.filter(k => k.wlicz).reduce((a, k) => a + k.gotowkaPLN, 0);
  const wartosc = poz.reduce((a, p) => a + p.wartoscPLN, 0) + gotowka;
  // struktura -> oczekiwana stopa realna
  const klasy = {}; poz.forEach(p => { klasy[p.klasa] = (klasy[p.klasa] || 0) + p.wartoscPLN; }); if (gotowka) klasy['Gotówka'] = (klasy['Gotówka'] || 0) + gotowka;
  const stopaAuto = wartosc ? Object.entries(klasy).reduce((a, [k, v]) => a + (FIRE_KLASY[k] ?? FIRE_KLASY.Inne) * v, 0) / wartosc : 5;
  // podatek Belki przy wypłatach z kont opodatkowanych (od części stanowiącej zysk)
  const typ = Object.fromEntries(CP.konta.map(k => [k.nazwa, k.typ]));
  const pozOp = poz.filter(p => typ[p.konto] === 'Opodatkowane');
  const wOp = pozOp.reduce((a, p) => a + p.wartoscPLN, 0), kOp = pozOp.reduce((a, p) => a + (p.kosztPLNr ?? p.kosztPLN), 0);
  const udzialOp = wartosc ? wOp / wartosc : 0, zyskFrac = wOp ? Math.max(0, (wOp - kOp) / wOp) : 0;
  // średnie wpłaty z ostatnich 12 miesięcy
  const od = new Date(Date.now() - 365 * 864e5).toISOString().slice(0, 10);
  const wpl12 = S.wplaty.filter(w => w.data >= od && kontaW.includes(w.konto)).reduce((a, w) => a + num(w.kwotaPLN), 0);
  // dochód pasywny netto z ostatnich 12 miesięcy
  const pas12 = CP.dyw.filter(d => d.data >= od && kontaW.includes((S.strategie.find(s => s.nazwa === d.strategia) || {}).konto)).reduce((a, d) => a + (d.nettoPLNprawdziwe ?? d.nettoPLN), 0);
  const xr = xirrPortfel(S, CP);
  const inflPL = (() => { const r = S.inflacja.filter(x => has(x.mm)).slice(-12); return r.length === 12 ? r.reduce((a, x) => a * (1 + num(x.mm) / 100), 1) - 1 : null; })();
  return { CP, konta, wartosc, klasy, stopaAuto, udzialOp, zyskFrac, wplAvg: wpl12 / 12, pas12, xr, inflPL };
}

/* symulacja w dzisiejszych złotych (stopa realna), miesięcznie; zwraca miesiąc osiągnięcia celu */
function fireSym(V0, wplata, stopa, wzrost, cel, maxLat = 60) {
  const r = Math.pow(1 + stopa / 100, 1 / 12) - 1; let V = V0, c = wplata, wpl = V0; const pts = [[0, V0]]; let m = null;
  if (V0 >= cel) m = 0;
  for (let i = 1; i <= maxLat * 12; i++) {
    V = V * (1 + r) + c; wpl += c;
    if (i % 12 === 0) { c *= 1 + wzrost / 100; pts.push([i, V]); }
    if (m === null && V >= cel) m = i;
  }
  return { m, pts, V };
}

function fireWyniki() {
  const D = fireDane(), f = CFG.fire || {};
  const o = {
    wydatki: has(f.wydatki) ? num(f.wydatki) : (num((CFG.sym || {}).wydatki) || 5000),
    swr: has(f.swr) ? num(f.swr) : 4,
    stopa: has(f.stopa) ? num(f.stopa) : Math.round(D.stopaAuto * 10) / 10,
    wplata: has(f.wplata) ? num(f.wplata) : Math.round(D.wplAvg),
    wzrost: has(f.wzrost) ? num(f.wzrost) : 0,
    lata: has(f.lata) ? num(f.lata) : 15,
    rok: has(f.rok) ? num(f.rok) : '',
    belka: f.belka !== false,
  };
  const roczne = o.wydatki * 12;
  // podatek przy wypłatach: 19% od części zysku na kontach opodatkowanych; udział zysku rośnie z czasem -> liczymy dla momentu FIRE
  const celDla = zf => roczne / (o.swr / 100) / (1 - (o.belka ? 0.19 * zf * D.udzialOp : 0));
  let cel = celDla(D.zyskFrac), sym = fireSym(D.wartosc, o.wplata, o.stopa, o.wzrost, cel);
  for (let k = 0; k < 3 && sym.m; k++) {   // udział zysku w chwili FIRE: (wartość − wpłacony kapitał) / wartość
    const n = sym.m, r = Math.pow(1 + o.stopa / 100, 1 / 12) - 1; let V = D.wartosc, baza = D.wartosc * (1 - D.zyskFrac), c = o.wplata;
    for (let i = 1; i <= n; i++) { V = V * (1 + r) + c; baza += c; if (i % 12 === 0) c *= 1 + o.wzrost / 100; }
    cel = celDla(V ? Math.max(0, 1 - baza / V) : D.zyskFrac); sym = fireSym(D.wartosc, o.wplata, o.stopa, o.wzrost, cel);
  }
  const efTax = cel ? 1 - roczne / (o.swr / 100) / cel : 0;
  const r = Math.pow(1 + o.stopa / 100, 1 / 12) - 1, n = o.lata * 12;
  const potrzebnaWplata = n > 0 ? Math.max(0, (cel - D.wartosc * Math.pow(1 + r, n)) * r / (Math.pow(1 + r, n) - 1 || 1)) : 0;
  const coast = cel / Math.pow(1 + o.stopa / 100, o.lata);
  const bezpiecznieTeraz = D.wartosc * o.swr / 100 / 12 * (1 - efTax);
  return { D, o, cel, sym, efTax, potrzebnaWplata, coast, bezpiecznieTeraz, brakuje: Math.max(0, cel - D.wartosc), postep: cel ? D.wartosc / cel : 0 };
}

function fireSet(k, v) { CFG.fire = CFG.fire || {}; if (v === '' || v === null) delete CFG.fire[k]; else CFG.fire[k] = v; saveCfg(); render(); }
function fireKonto(nazwa, wlicz) { CFG.fire = CFG.fire || {}; const s = new Set(CFG.fire.wyklucz || []); wlicz ? s.delete(nazwa) : s.add(nazwa); CFG.fire.wyklucz = [...s]; saveCfg(); render(); }

function vFire() {
  const R = fireWyniki(), { D, o } = R, f = CFG.fire || {};
  const teraz = new Date(), dataZa = m => { const d = new Date(teraz); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 7); };
  const czas = m => m === null ? '<span class="neg">ponad 60 lat</span>' : m === 0 ? '<span class="pos">już teraz</span>' : `${Math.floor(m / 12)} l. ${m % 12} mies.`;
  const wiek = m => o.rok && m !== null ? ` · wiek ${teraz.getFullYear() + Math.floor(m / 12) - o.rok}` : '';
  const fld = (k, l, val, auto, step = 'any', help = '') => `<label>${l}<input type="number" step="${step}" value="${esc(has(f[k]) ? f[k] : '')}" placeholder="${esc(auto)}" onchange="fireSet('${k}',this.value===''?'':num(this.value))">${help ? `<span class="help">${help}</span>` : ''}</label>`;

  // scenariusze
  const stopy = [Math.max(0, o.stopa - 2), o.stopa, o.stopa + 2].map(x => Math.round(x * 10) / 10);
  const wpl = [0, o.wplata, Math.round(o.wplata * 1.5), Math.round(o.wplata * 2)].filter((v, i, a) => a.indexOf(v) === i);
  const scen = stopy.map(s => ({ s, c: wpl.map(c => fireSym(D.wartosc, c, s, o.wzrost, R.cel).m) }));
  const scenTbl = `<div class="tbl"><table><thead><tr><th>Stopa realna \\ wpłata mies.</th>${wpl.map(c => `<th class="n">${zlPLN(c, 0)}${c === o.wplata ? ' <span class="mut">(obecnie)</span>' : ''}</th>`).join('')}</tr></thead><tbody>
    ${scen.map(r => `<tr><td><b>${String(r.s).replace('.', ',')}%</b>${r.s === o.stopa ? ' <span class="mut">(założona)</span>' : ''}</td>${r.c.map((m, i) => `<td class="n" style="${r.s === o.stopa && wpl[i] === o.wplata ? 'background:#eef3fb;font-weight:600' : ''}">${czas(m)}${m ? `<br><span class="mut" style="font-size:11.5px">${dataZa(m)}</span>` : ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  // wykres: wartość w dzisiejszych zł (3 scenariusze) vs cel
  const lat = Math.min(60, Math.max(10, Math.ceil(((R.sym.m ?? 360) + 36) / 12)));
  const line = (s, name, color, dash) => ({ name, color, dash, points: fireSym(D.wartosc, o.wplata, s, o.wzrost, R.cel, lat).pts.map(([m, v]) => [dataZa(m) + '-01', v]) });
  const chart = lineChart([line(o.stopa, `Portfel (${String(o.stopa).replace('.', ',')}% realnie)`, '#1565C0'), line(stopy[0], `Pesymistycznie (${String(stopy[0]).replace('.', ',')}%)`, '#94a3b8', true),
    line(stopy[2], `Optymistycznie (${String(stopy[2]).replace('.', ',')}%)`, '#26A69A', true),
    { name: 'Cel FIRE', color: '#F9A825', dash: true, points: [[dataZa(0) + '-01', R.cel], [dataZa(lat * 12) + '-01', R.cel]] }], { area: false, pln: true, h: 280 });

  const klasyTxt = Object.entries(D.klasy).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${esc(k)} ${pct(v / D.wartosc)} × ${String(FIRE_KLASY[k] ?? FIRE_KLASY.Inne).replace('.', ',')}%`).join(' · ');
  const pasPokrycie = R.o.wydatki ? D.pas12 / 12 / o.wydatki : 0;

  return ['FIRE – niezależność finansowa', 'Ile brakuje, żeby portfel pokrywał Twoje wydatki – liczone z aktualnych danych, w dzisiejszych złotych', `
    <div class="kpis">
      ${kpi('Cel FIRE', zlPLN(R.cel, 0), `${zlPLN(o.wydatki, 0)}/mies. · wypłata ${String(o.swr).replace('.', ',')}% rocznie${R.efTax > 0.0005 ? ` · z podatkiem Belki ~${pct(R.efTax)}` : ''}`, 'main')}
      ${kpi('Masz dziś', zlPLN(D.wartosc, 0), `${pct(R.postep)} celu`)}
      ${kpi('Brakuje', R.brakuje ? `<span class="neg">${zlPLN(R.brakuje, 0)}</span>` : '<span class="pos">0 zł – cel osiągnięty</span>', R.brakuje ? `${pct(1 - R.postep)} celu` : '')}
      ${kpi('FIRE osiągniesz', R.sym.m === null ? '<span class="neg">ponad 60 lat</span>' : R.sym.m === 0 ? '<span class="pos">teraz</span>' : dataZa(R.sym.m), `za ${czas(R.sym.m)}${wiek(R.sym.m)} · przy ${zlPLN(o.wplata, 0)}/mies.`)}
      ${kpi('Portfel wypłaca już dziś', zlPLN(R.bezpiecznieTeraz, 0) + '/mies.', `${pct(o.wydatki ? R.bezpiecznieTeraz / o.wydatki : 0)} wydatków (reguła ${String(o.swr).replace('.', ',')}%)`)}
    </div>
    <div class="card"><h3>Postęp do FIRE<span class="sp"></span><small>${zlPLN(D.wartosc, 0)} z ${zlPLN(R.cel, 0)}</small></h3>
      <div class="bar" style="height:16px"><i style="width:${Math.min(100, R.postep * 100).toFixed(1)}%;background:linear-gradient(90deg,#1565C0,#26A69A)"></i></div>
      <div class="row mut" style="font-size:12px;margin-top:6px;justify-content:space-between"><span>0</span><span>Coast FIRE (${o.lata} lat): ${zlPLN(R.coast, 0)}${D.wartosc >= R.coast ? ' <b class="pos">✓ osiągnięty</b>' : ''}</span><span>${zlPLN(R.cel, 0)}</span></div></div>
    <div class="grid g2" style="margin-top:16px"><div class="card"><h3>Prognoza w dzisiejszych złotych</h3>${chart}</div>
      <div class="card"><h3>Założenia <small>puste pole = wartość z Twoich danych</small></h3><div class="form">
        ${fld('wydatki', 'Miesięczne wydatki na emeryturze (zł)', o.wydatki, 5000)}
        ${fld('swr', 'Stopa wypłat rocznie (%)', o.swr, 4, '0.1', '4% – klasyczna reguła; na 40+ lat bezpieczniej 3–3,5%')}
        ${fld('wplata', 'Wpłata miesięczna (zł)', o.wplata, Math.round(D.wplAvg), 'any', `średnia z ostatnich 12 mies.: ${zlPLN(D.wplAvg, 0)}`)}
        ${fld('stopa', 'Stopa zwrotu realnie, po inflacji (%)', o.stopa, Math.round(D.stopaAuto * 10) / 10, '0.1', `wg struktury portfela: ${String(Math.round(D.stopaAuto * 10) / 10).replace('.', ',')}%`)}
        ${fld('wzrost', 'Realny wzrost wpłat co rok (%)', o.wzrost, 0, '0.5')}
        ${fld('lata', 'Horyzont dla wyliczeń (lat)', o.lata, 15, '1')}
        ${fld('rok', 'Rok urodzenia (opcjonalnie)', o.rok, '', '1')}
        <label>Podatek Belki przy wypłatach<select onchange="fireSet('belka',this.value==='1')"><option value="1" ${o.belka ? 'selected' : ''}>uwzględniaj (konta opodatkowane)</option><option value="0" ${o.belka ? '' : 'selected'}>pomiń</option></select></label>
      </div>
      <div class="mut" style="font-size:12px;margin-top:8px">Twoja dotychczasowa stopa (XIRR): ${D.xr === null ? 'brak danych' : pct(D.xr)} nominalnie${D.xr !== null && D.inflPL !== null ? `, ok. ${pct((1 + D.xr) / (1 + D.inflPL) - 1)} po inflacji` : ''}. Oczekiwana stopa wg struktury: ${klasyTxt || '–'}.</div></div></div>
    <div class="card" style="margin-top:16px"><h3>Kiedy FIRE – scenariusze <small>czas do celu przy różnej stopie i wpłacie</small></h3>${scenTbl}</div>
    <div class="grid g2e" style="margin-top:16px"><div class="card"><h3>Co zrobić, żeby zdążyć w ${o.lata} lat</h3>
      <div class="kpis" style="margin:0">${kpi(`Potrzebna wpłata`, zlPLN(R.potrzebnaWplata, 0) + '/mies.', R.potrzebnaWplata <= o.wplata ? '<span class="pos">obecne wpłaty wystarczą</span>' : `o ${zlPLN(R.potrzebnaWplata - o.wplata, 0)} więcej niż teraz`)}
      ${kpi('Coast FIRE', zlPLN(R.coast, 0), D.wartosc >= R.coast ? '<span class="pos">masz już tyle – bez dalszych wpłat cel przyjdzie sam</span>' : `tyle wystarczy mieć dziś bez dalszych wpłat (brakuje ${zlPLN(R.coast - D.wartosc, 0)})`)}</div>
      <div class="mut" style="font-size:12.5px;margin-top:10px">Każde 500 zł mniej wydatków miesięcznie obniża cel o ${zlPLN(500 * 12 / (o.swr / 100) / (1 - R.efTax), 0)}.</div></div>
      <div class="card"><h3>Dochód pasywny <small>ostatnie 12 mies., netto</small></h3>
      <div class="kpis" style="margin:0">${kpi('Dywidendy i odsetki', zlPLN(D.pas12 / 12, 0) + '/mies.', `${pct(pasPokrycie)} Twoich wydatków`)}${kpi('Rocznie', zlPLN(D.pas12, 0))}</div>
      <div class="mut" style="font-size:12.5px;margin-top:10px">Dochód pasywny jest już zawarty w stopie zwrotu – to podgląd, jaka część wydatków jest pokryta gotówką bez sprzedawania aktywów.</div></div></div>
    <div class="card" style="margin-top:16px"><h3>Konta wliczane do FIRE</h3>${table([
      { h: '', f: k => `<input type="checkbox" ${k.wlicz ? 'checked' : ''} onchange="fireKonto('${esc(k.nazwa)}',this.checked)">` },
      { h: 'Konto', f: k => `<b>${esc(k.nazwa)}</b> <span class="mut">${esc(k.typ)}</span>` }, { h: 'Wartość', n: 1, f: k => zlPLN(k.razem, 0) },
      { h: '', f: k => k.typ === 'IKE' || k.typ === 'IKZE' ? '<span class="mut">wypłata bez podatku po 60. r.ż. – przy wcześniejszym FIRE potrzebujesz pieniędzy także poza IKE</span>' : '' },
    ], D.konta)}</div>
    <div class="mut" style="font-size:12px;margin-top:10px">Wszystko w dzisiejszych złotych: stopa zwrotu jest realna (po inflacji), więc cel i prognozy nie wymagają przeliczania o inflację. Cel = roczne wydatki ÷ stopa wypłat, powiększony o podatek Belki od części zysku na kontach opodatkowanych (udział zysku szacowany na moment osiągnięcia FIRE). To symulacja przy stałej stopie – rzeczywiste wyniki będą się wahać.</div>`,
    `<button class="btn ghost" onclick="CFG.fire={};saveCfg();render()">Przywróć dane z portfela</button>`];
}

boot();
</script>
</body>
</html>
