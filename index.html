<style>:root{--bg:#f3f5f9;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e9f0;--blue:#1565c0;--blue2:#e8f0fc;--green:#16a34a;--red:#dc2626;--amber:#b45309;--side:#0f2747;--r:12px}

body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}

tr.drop-before td{box-shadow:inset 0 2px 0 #1565c0}tr.drop-after td{box-shadow:inset 0 -2px 0 #1565c0}

<body>
<div class="app">
  <aside id="side"><div class="brand"><div class="logo">📈</div>Mój portfel</div><nav class="nav" id="nav"></nav><div style="font-size:11px;color:#6f86a8;padding:16px 10px 4px">wersja 2026-11-09 19:15</div></aside>
  <main>
    <div class="top">
      <button class="btn ghost menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h1 id="title"></h1>
      <span class="badge" id="sync" onclick="syncNow()"></span>
      <div class="row" id="topActions"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===================== SILNIK OBLICZEŃ ===================== */
const EPS = 1e-9;
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const num = v => { if (v === '' || v === null || v === undefined) return 0; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const has = v => v !== '' && v !== null && v !== undefined && !(typeof v === 'number' && isNaN(v));
const ymd = d => { const x = new Date(d); return isNaN(x) ? '' : x.toISOString().slice(0, 10); };
const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

function defaultState() {
  return {
    strategie: [
      { id: 's1', nazwa: 'Długi termin', konto: 'XTB USD', kapital: '', opis: 'ETF-y na lata', kolor: '#1565C0' },
      { id: 's2', nazwa: 'Dywidendowa', konto: 'XTB USD', kapital: '', opis: '', kolor: '#26A69A' },
      { id: 's3', nazwa: 'IKE', konto: 'XTB IKE', kapital: '', opis: '', kolor: '#7E57C2' },
      { id: 's4', nazwa: 'Metale', konto: 'Sejf', kapital: '', opis: 'Kruszce fizyczne', kolor: '#F9A825' },
      { id: 's5', nazwa: 'Krypto', konto: 'Krypto', kapital: '', opis: '', kolor: '#EF5350' },
    ],
    konta: [
      { id: 'k1', nazwa: 'XTB USD', typ: 'Opodatkowane', waluta: 'USD', gotowka: '', model: 'TAK' },
      { id: 'k2', nazwa: 'XTB PLN', typ: 'Opodatkowane', waluta: 'PLN', gotowka: '', model: 'TAK' },
      { id: 'k3', nazwa: 'XTB IKE', typ: 'IKE', waluta: 'PLN', gotowka: '', model: 'TAK' },
      { id: 'k4', nazwa: 'Sejf', typ: 'Poza PIT-38', waluta: 'PLN', gotowka: '', model: 'TAK' },
      { id: 'k5', nazwa: 'Obligacje skarbowe', typ: 'Poza PIT-38', waluta: 'PLN', gotowka: '', model: 'TAK' },
      { id: 'k6', nazwa: 'Krypto', typ: 'Opodatkowane', waluta: 'USD', gotowka: '', model: 'TAK' },
    ],
    instrumenty: [
      { id: 'i1', ticker: 'CSPX', nazwa: 'iShares Core S&P 500 (Acc)', klasa: 'Akcje/ETF', koszyk: 'CSPX', waluta: 'USD', cena: '', dataCeny: '', symbol: 'LON:CSPX', cenaAuto: '' },
      { id: 'i2', ticker: 'IWDA', nazwa: 'iShares Core MSCI World (Acc)', klasa: 'Akcje/ETF', koszyk: 'IWDA', waluta: 'USD', cena: '', dataCeny: '', symbol: 'LON:IWDA', cenaAuto: '' },
      { id: 'i3', ticker: 'IB01', nazwa: 'iShares $ Treasury Bond 0-1yr', klasa: 'Obligacje', koszyk: 'IB01', waluta: 'USD', cena: '', dataCeny: '', symbol: 'LON:IB01', cenaAuto: '' },
      { id: 'i4', ticker: 'ZŁOTO', nazwa: 'Złoto fizyczne (1 oz)', klasa: 'Złoto', koszyk: 'ZŁOTO', waluta: 'USD', cena: '', dataCeny: '', symbol: 'YAHOO:GC=F', cenaAuto: '' },
      { id: 'i5', ticker: 'SREBRO', nazwa: 'Srebro fizyczne (1 oz)', klasa: 'Srebro', koszyk: 'SREBRO', waluta: 'USD', cena: '', dataCeny: '', symbol: 'YAHOO:SI=F', cenaAuto: '' },
      { id: 'i6', ticker: 'BTC', nazwa: 'Bitcoin', klasa: 'Krypto', koszyk: 'BTC', waluta: 'USD', cena: '', dataCeny: '', symbol: 'YAHOO:BTC-USD', cenaAuto: '' },
    ],
    transakcje: [], dywidendy: [], wplaty: [], inflacja: [], historia: [],
    cele: [
      { id: 'c1', konto: '', koszyk: 'CSPX', tickery: 'CSPX', grupa: 'CORE', cel: 39 }, { id: 'c2', konto: '', koszyk: 'IWDA', tickery: 'IWDA', grupa: 'CORE', cel: 26 },
      { id: 'c3', konto: '', koszyk: 'IB01', tickery: 'IB01', grupa: 'STABILIZATORY', cel: 17 }, { id: 'c4', konto: '', koszyk: 'ZŁOTO', tickery: 'ZŁOTO', grupa: 'STABILIZATORY', cel: 6 },
      { id: 'c5', konto: '', koszyk: 'SREBRO', tickery: 'SREBRO', grupa: 'STABILIZATORY', cel: 4 }, { id: 'c6', konto: '', koszyk: 'BTC', tickery: 'BTC', grupa: 'ASYMETRIA', cel: 8 },
    ],
    ustawienia: { kursy: { USD: '', EUR: '', GBP: '', CHF: '' }, kursyData: '', stawka: 19 },
  };
}

/* indeks inflacji: miesiąc 'YYYY-MM' -> poziom cen na koniec miesiąca (start = 1) */
function inflIndex(inflacja) {
  const rows = (inflacja || []).filter(r => r.miesiac && has(r.mm)).sort((a, b) => a.miesiac.localeCompare(b.miesiac));
  const idx = []; let lvl = 1;
  for (const r of rows) { lvl *= 1 + num(r.mm) / 100; idx.push([r.miesiac, lvl]); }
  const at = (ym) => { let v = 1; for (const [m, l] of idx) { if (m <= ym) v = l; else break; } return v; };
  const prevMonth = (d) => { const x = new Date(d + 'T00:00:00'); x.setDate(0); return x.toISOString().slice(0, 7); };
  return {
    now: idx.length ? idx[idx.length - 1][1] : 1,
    lastMonth: idx.length ? idx[idx.length - 1][0] : '',
    before: (dateStr) => at(prevMonth(dateStr)),       // poziom cen przed danym dniem (koniec poprzedniego miesiąca)
    atDate: (dateStr) => at(prevMonth(dateStr)),
  };
}

function calc(S) {
  const rates = S.ustawienia.kursy || {};
  const rateNow = cur => (!cur || cur === 'PLN') ? 1 : num(rates[cur]);
  const instr = {}; S.instrumenty.forEach(i => { if (i.ticker) instr[i.ticker] = i; });
  const strat = {}; S.strategie.forEach(s => { strat[s.nazwa] = s; });
  const konto = {}; S.konta.forEach(k => { konto[k.nazwa] = k; });
  const curOf = t => (instr[t] && instr[t].waluta) || 'USD';
  const priceOf = t => { const i = instr[t]; if (!i) return 0; return has(i.cena) ? num(i.cena) : num(i.cenaAuto); };
  const warnings = [];

  const txs = S.transakcje.filter(t => t.data && t.ticker && t.typ && num(t.ilosc) > 0)
    .map((t, n) => ({ ...t, _n: n })).sort((a, b) => (a.data === b.data ? a._n - b._n : a.data.localeCompare(b.data)));

  function fifo(keyFn) {
    const lots = {}, realized = [];
    for (const t of txs) {
      const cur = curOf(t.ticker), q = num(t.ilosc), p = num(t.cena), fee = num(t.prowizja);
      const kursOk = cur === 'PLN' || has(t.kurs);
      const kurs = cur === 'PLN' ? 1 : (has(t.kurs) ? num(t.kurs) : rateNow(cur));
      const key = keyFn(t);
      if (!lots[key]) lots[key] = [];
      if (t.typ === 'KUPNO') {
        const cost = q * p + fee;
        lots[key].push({ q, uc: cost / q, ucPLN: cost * kurs / q, data: t.data, id: t.id, kursOk });
      } else if (t.typ === 'SPRZEDAŻ') {
        let left = q, cost = 0, costPLN = 0, allOk = kursOk, firstBuy = null;
        while (left > EPS && lots[key].length) {
          const lot = lots[key][0], take = Math.min(left, lot.q);
          cost += take * lot.uc; costPLN += take * lot.ucPLN; if (!lot.kursOk) allOk = false; if (!firstBuy) firstBuy = lot.data;
          lot.q -= take; left -= take; if (lot.q <= EPS) lots[key].shift();
        }
        if (left > EPS) warnings.push(`Sprzedaż ${t.ticker} z ${t.data} (${t.strategia}): sprzedano więcej niż kupiono (${r2(left)} szt.).`);
        const proceeds = q * p - fee;
        realized.push({ id: t.id, data: t.data, rok: +t.data.slice(0, 4), ticker: t.ticker, strategia: t.strategia, waluta: cur,
          ilosc: q, przychod: proceeds, koszt: cost, zysk: proceeds - cost, przychodPLN: proceeds * kurs, kosztPLN: costPLN,
          zyskPLN: proceeds * kurs - costPLN, kursOk: allOk, kupiono: firstBuy });
      }
    }
    return { lots, realized };
  }

  // pozycje i wynik strategii: FIFO w ramach strategii
  const P = fifo(t => t.strategia + '|' + t.ticker);
  // podatek: FIFO w ramach konta (rachunku)
  const T = fifo(t => ((strat[t.strategia] || {}).konto || '?') + '|' + t.ticker);

  const pozycje = [];
  for (const [key, lots] of Object.entries(P.lots)) {
    const qty = lots.reduce((a, l) => a + l.q, 0);
    if (qty <= EPS) continue;
    const [s, ticker] = key.split('|');
    const i = instr[ticker] || {}; const cur = curOf(ticker);
    const koszt = lots.reduce((a, l) => a + l.q * l.uc, 0), kosztPLN = lots.reduce((a, l) => a + l.q * l.ucPLN, 0);
    const cena = priceOf(ticker), wartosc = qty * cena, wartoscPLN = wartosc * rateNow(cur);
    pozycje.push({ strategia: s, konto: (strat[s] || {}).konto || '', ticker, nazwa: i.nazwa || '', klasa: i.klasa || 'Inne', koszyk: i.koszyk || '',
      waluta: cur, ilosc: qty, koszt, kosztPLN, sredniaCena: koszt / qty, cena, brakCeny: !cena, wartosc, wartoscPLN,
      zysk: wartosc - koszt, zyskPct: koszt ? (wartosc - koszt) / koszt : 0, zyskPLN: wartoscPLN - kosztPLN,
      od: lots[0].data, kursBrak: lots.some(l => !l.kursOk) });
  }

  const dyw = S.dywidendy.filter(d => d.data && has(d.brutto)).map(d => {
    const cur = d.ticker ? curOf(d.ticker) : (konto[(strat[d.strategia] || {}).konto] || {}).waluta || 'PLN';
    const kurs = cur === 'PLN' ? 1 : (has(d.kurs) ? num(d.kurs) : rateNow(cur));
    const typ = (konto[(strat[d.strategia] || {}).konto] || {}).typ || 'Opodatkowane';
    const bruttoPLN = num(d.brutto) * kurs, podatekPLN = num(d.podatek) * kurs;
    const doplata = typ === 'Opodatkowane' && cur !== 'PLN' ? Math.max(0, r2(S.ustawienia.stawka / 100 * bruttoPLN) - podatekPLN) : 0;
    return { ...d, waluta: cur, kursOk: cur === 'PLN' || has(d.kurs), netto: num(d.brutto) - num(d.podatek), bruttoPLN, podatekPLN,
      nettoPLN: bruttoPLN - podatekPLN, doplata, rok: +d.data.slice(0, 4), typ };
  });

  // gotówka na koncie: liczona automatycznie (wpłaty − zakupy + sprzedaże + dywidendy), chyba że wpisana ręcznie
  const kontoStrat = s => (strat[s] || {}).konto || '';
  const toAcc = (amount, cur, kurs, accCur) => cur === accCur ? amount : (accCur === 'PLN' ? amount * kurs : (rateNow(accCur) ? amount * kurs / rateNow(accCur) : 0));
  const cashAuto = {};
  S.konta.forEach(k => { cashAuto[k.nazwa] = 0; });
  S.wplaty.filter(w => w.data && has(w.kwotaPLN)).forEach(w => { const k = konto[w.konto]; if (!k) return;
    cashAuto[k.nazwa] += k.waluta === 'PLN' ? num(w.kwotaPLN) : (has(w.kwotaWal) ? num(w.kwotaWal) : (rateNow(k.waluta) ? num(w.kwotaPLN) / rateNow(k.waluta) : 0)); });
  txs.forEach(t => { const k = konto[kontoStrat(t.strategia)]; if (!k) return; const cur = curOf(t.ticker);
    const kurs = cur === 'PLN' ? 1 : (has(t.kurs) ? num(t.kurs) : rateNow(cur));
    const amt = t.typ === 'KUPNO' ? -(num(t.ilosc) * num(t.cena) + num(t.prowizja)) : (num(t.ilosc) * num(t.cena) - num(t.prowizja));
    cashAuto[k.nazwa] += toAcc(amt, cur, kurs, k.waluta); });
  S.dywidendy.filter(d => d.data && has(d.brutto)).forEach(d => { const k = konto[kontoStrat(d.strategia)]; if (!k) return;
    const cur = d.ticker ? curOf(d.ticker) : k.waluta, kurs = cur === 'PLN' ? 1 : (has(d.kurs) ? num(d.kurs) : rateNow(cur));
    cashAuto[k.nazwa] += toAcc(num(d.brutto) - num(d.podatek), cur, kurs, k.waluta); });
  const gotowka = S.konta.map(k => { const manual = has(k.gotowka), kw = manual ? num(k.gotowka) : Math.round(cashAuto[k.nazwa] * 100) / 100;
    return { konto: k.nazwa, waluta: k.waluta, kwota: kw, auto: !manual, wyliczona: cashAuto[k.nazwa], pln: kw * rateNow(k.waluta) }; });
  const sumPLN = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
  const wartoscPozycji = sumPLN(pozycje, p => p.wartoscPLN);
  const gotowkaPLN = sumPLN(gotowka, g => g.pln);
  const wartosc = wartoscPozycji + gotowkaPLN;
  const wplaty = S.wplaty.filter(w => w.data && has(w.kwotaPLN));
  const kapital = sumPLN(wplaty, w => num(w.kwotaPLN));
  const II = inflIndex(S.inflacja);
  const kapitalRealny = sumPLN(wplaty, w => num(w.kwotaPLN) * II.now / II.before(w.data));
  const kapitalRealnyNa = (d) => sumPLN(wplaty.filter(w => w.data <= d), w => num(w.kwotaPLN) * II.atDate(d) / II.before(w.data));

  // strategie
  const strategie = S.strategie.map(s => {
    const poz = pozycje.filter(p => p.strategia === s.nazwa);
    const real = P.realized.filter(r => r.strategia === s.nazwa);
    const dv = dyw.filter(d => d.strategia === s.nazwa);
    const w = sumPLN(poz, p => p.wartoscPLN), k = sumPLN(poz, p => p.kosztPLN);
    const zr = sumPLN(real, r => r.zyskPLN), dn = sumPLN(dv, d => d.nettoPLN);
    const kosztWal = sumPLN(poz, p => p.koszt), zrWal = sumPLN(real, r => r.zysk), dnWal = sumPLN(dv, d => d.netto);
    const k_ = konto[s.konto] || {};
    return { ...s, typ: k_.typ || '', walutaKonta: k_.waluta || '', pozycje: poz, zamkniete: real, dywidendy: dv, wartosc: w, koszt: k,
      niezreal: w - k, niezrealPct: k ? (w - k) / k : 0, zrealizowany: zr, dywidendyNetto: dn, wynik: w - k + zr + dn,
      wolne: has(s.kapital) ? num(s.kapital) - kosztWal + zrWal + dnWal : null,
      udzial: wartosc ? w / wartosc : 0 };
  });

  // konta
  const konta = S.konta.map(k => {
    const w = sumPLN(pozycje.filter(p => p.konto === k.nazwa), p => p.wartoscPLN);
    const gg = gotowka.find(x => x.konto === k.nazwa), g = gg.pln;
    const kap = sumPLN(wplaty.filter(x => x.konto === k.nazwa), x => num(x.kwotaPLN));
    return { ...k, wartoscPozycji: w, gotowkaPLN: g, gotowkaKwota: gg.kwota, gotowkaAuto: gg.auto, gotowkaWyliczona: gg.wyliczona, razem: w + g, kapital: kap, zysk: kap ? w + g - kap : null, zyskPct: kap ? (w + g - kap) / kap : null };
  });

  const groupBy = (arr, f, v) => { const m = {}; arr.forEach(x => { const k = f(x); m[k] = (m[k] || 0) + v(x); }); return m; };
  const klasy = groupBy(pozycje, p => p.klasa, p => p.wartoscPLN); if (gotowkaPLN) klasy['Gotówka'] = (klasy['Gotówka'] || 0) + gotowkaPLN;
  const waluty = groupBy(pozycje, p => p.waluta, p => p.wartoscPLN); gotowka.forEach(g => { if (g.pln) waluty[g.waluta] = (waluty[g.waluta] || 0) + g.pln; });

  // portfele docelowe: '' = cały portfel, inaczej nazwa konta. Koszyk = nazwa + lista instrumentów + cel %
  const wModelu = p => ((konto[p.konto] || {}).model || 'TAK') !== 'NIE';
  const tickOf = c => String(c.tickery || c.koszyk || '').split(',').map(s => s.trim()).filter(Boolean);
  function modelFor(kontoNazwa = '') {
    const rows = S.cele.filter(c => (c.koszyk || c.tickery) && (c.konto || '') === kontoNazwa);
    const poz = kontoNazwa ? pozycje.filter(p => p.konto === kontoNazwa) : pozycje.filter(wModelu);
    const val = t => poz.filter(p => p.ticker === t).reduce((a, p) => a + p.wartoscPLN, 0);
    const used = new Set(rows.flatMap(tickOf));
    const raw = rows.map(c => ({ ...c, lista: tickOf(c), celPct: num(c.cel) / 100, wartosc: tickOf(c).reduce((a, t) => a + val(t), 0) }));
    const tot = raw.reduce((a, m) => a + m.wartosc, 0);
    const out = raw.map(m => ({ ...m, udzial: tot ? m.wartosc / tot : 0, roznica: m.celPct * tot - m.wartosc, odchylenie: tot ? (m.wartosc / tot - m.celPct) * 100 : 0 }));
    const poza = poz.filter(p => !used.has(p.ticker)).reduce((a, p) => a + p.wartoscPLN, 0);
    const got = kontoNazwa ? ((gotowka.find(g => g.konto === kontoNazwa) || {}).pln || 0) : gotowkaPLN;
    const rozdziel = kwota => { const T2 = tot + kwota, def = out.map(m => Math.max(0, m.celPct * T2 - m.wartosc)), sd = def.reduce((a, b) => a + b, 0); return out.map((m, i) => sd ? kwota * def[i] / sd : 0); };
    return { rows: out, tot, poza, gotowka: got, rozdziel, sumaCel: raw.reduce((a, m) => a + num(m.cel), 0) };
  }
  const M0 = modelFor('');
  const model = M0.rows, poza = M0.poza, rozdziel = M0.rozdziel;

  // podatki
  const typKonta = s => (konto[(strat[s] || {}).konto] || {}).typ || 'Opodatkowane';
  const klasaOf = t => (instr[t] || {}).klasa || '';
  function podatki(rok, strataPrev = 0, kryptoPrev = 0) {
    const stawka = num(S.ustawienia.stawka) / 100;
    const sprzedaze = T.realized.filter(r => r.rok === rok && typKonta(r.strategia) === 'Opodatkowane');
    const pap = sprzedaze.filter(r => klasaOf(r.ticker) !== 'Krypto');
    const przychod = sumPLN(pap, r => r.przychodPLN), koszty = sumPLN(pap, r => r.kosztPLN), dochod = przychod - koszty;
    const podstawa = Math.max(0, Math.round(dochod - strataPrev)), podatekPap = Math.round(podstawa * stawka);
    const dv = dyw.filter(d => d.rok === rok && d.typ === 'Opodatkowane');
    const dywBrutto = sumPLN(dv, d => d.bruttoPLN), dywPobrany = sumPLN(dv, d => d.podatekPLN), dywDoplata = Math.round(sumPLN(dv, d => d.doplata));
    const kPrzych = sumPLN(sprzedaze.filter(r => klasaOf(r.ticker) === 'Krypto'), r => r.przychodPLN);
    const kKoszt = sumPLN(txs.filter(t => t.typ === 'KUPNO' && +t.data.slice(0, 4) === rok && klasaOf(t.ticker) === 'Krypto' && typKonta(t.strategia) === 'Opodatkowane'),
      t => { const cur = curOf(t.ticker); return (num(t.ilosc) * num(t.cena) + num(t.prowizja)) * (cur === 'PLN' ? 1 : (has(t.kurs) ? num(t.kurs) : rateNow(cur))); });
    const kDochod = Math.max(0, kPrzych - kKoszt - kryptoPrev), kNadwyzka = Math.max(0, kKoszt + kryptoPrev - kPrzych);
    const kPodatek = Math.round(Math.round(kDochod) * stawka);
    return { rok, sprzedaze: pap, przychod, koszty, dochod, podstawa, podatekPap, dywBrutto, dywPobrany, dywDoplata, dywidendy: dv,
      kPrzych, kKoszt, kDochod, kNadwyzka, kPodatek, razem: podatekPap + dywDoplata + kPodatek,
      brakKursow: pap.some(r => !r.kursOk) || dv.some(d => !d.kursOk) };
  }

  const zrealizowany = sumPLN(P.realized, r => r.zyskPLN);
  const dywNetto = sumPLN(dyw, d => d.nettoPLN);
  const lata = [...new Set([...T.realized.map(r => r.rok), ...dyw.map(d => d.rok), new Date().getFullYear()])].sort((a, b) => b - a);

  return { rateNow, pozycje, zamkniete: P.realized, dyw, strategie, konta, klasy, waluty, model, poza, rozdziel, modelFor, podatki, lata,
    wartosc, wartoscPozycji, gotowkaPLN, kapital, kapitalRealny, kapitalRealnyNa, inflNow: II.now, inflLast: II.lastMonth,
    zysk: wartosc - kapital, zyskPct: kapital ? (wartosc - kapital) / kapital : 0,
    zyskRealny: wartosc - kapitalRealny, zyskRealnyPct: kapitalRealny ? (wartosc - kapitalRealny) / kapitalRealny : 0,
    niezreal: wartoscPozycji - sumPLN(pozycje, p => p.kosztPLN), zrealizowany, dywNetto, warnings,
    usd: rateNow('USD') ? wartosc / rateNow('USD') : null };
}



/* ===================== WYKRESY SVG ===================== */
const PAL = ['#1565C0', '#26A69A', '#F9A825', '#7E57C2', '#EF5350', '#8D6E63', '#78909C', '#AB47BC', '#29B6F6', '#9CCC65'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtShort = v => { const a = Math.abs(v); if (a >= 1e6) return (v / 1e6).toFixed(1).replace('.', ',') + ' mln'; if (a >= 1e4) return Math.round(v / 1e3) + ' tys.'; if (a >= 1e3) return (v / 1e3).toFixed(1).replace('.', ',') + ' tys.'; if (a >= 100 || a === 0) return Math.round(v).toString(); return (+v.toFixed(a >= 10 ? 1 : 2)).toString().replace('.', ','); };
function niceTicks(min, max, n = 5) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
  return t;
}
function emptyChart(msg) { return `<div class="chart-empty">${esc(msg || 'Brak danych do wykresu')}</div>`; }

/* series: [{name, color, points:[[dateStr, value]]}], opts: {pct, h} */
function lineChart(series, opts = {}) {
  const pts = series.flatMap(s => s.points);
  if (pts.length < 2) return emptyChart(opts.empty || 'Wykres pojawi się po kilku dniach zapisów historii');
  const W = 640, H = opts.h || 240, L = 66, R = 14, T = 12, B = 28;
  const xs = pts.map(p => new Date(p[0]).getTime()), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (!opts.pct && opts.zero !== false) y0 = Math.min(y0, 0);
  if (y1 - y0 < Math.abs(y1) * 0.002) { const pad = Math.max(Math.abs(y1) * 0.002, 1); y0 -= pad; y1 += pad; }
  const ticks = niceTicks(y0, y1); y0 = ticks[0]; y1 = ticks[ticks.length - 1];
  const X = t => L + (W - L - R) * (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0));
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const stepT = ticks.length > 1 ? Math.abs(ticks[1] - ticks[0]) : 1;
  const fy = v => opts.pct ? (v * 100).toFixed(stepT < 0.01 ? 1 : 0).replace('.', ',') + '%' : (stepT < 1000 && Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('pl-PL') : fmtShort(v));
  let g = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${fy(v)}</text>`).join('');
  const span = x1 - x0, p2 = n => String(n).padStart(2, '0');
  const fx = d => span < 2 * 864e5 ? `${p2(d.getHours())}:${p2(d.getMinutes())}` : span < 120 * 864e5 ? `${p2(d.getDate())}.${p2(d.getMonth() + 1)}` : `${p2(d.getMonth() + 1)}.${String(d.getFullYear()).slice(2)}`;
  const nx = 5; for (let i = 0; i <= nx; i++) { const t = x0 + (x1 - x0) * i / nx; const d = new Date(t);
    g += `<text x="${X(t)}" y="${H - 8}" class="ax" text-anchor="middle">${fx(d)}</text>`; }
  const paths = series.map((s, k) => { const c = s.color || PAL[k];
    const sorted = s.points.slice().sort((a, b) => a[0].localeCompare(b[0]));
    const d = sorted.map((p, i) => `${i ? 'L' : 'M'}${X(new Date(p[0]).getTime()).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    const area = k === 0 && opts.area ? `<path d="${d}L${X(new Date(sorted[sorted.length - 1][0]).getTime())},${Y(y0)}L${X(new Date(sorted[0][0]).getTime())},${Y(y0)}Z" fill="${c}" opacity=".08"/>` : '';
    return area + `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>`; }).join('');
  const zero = !opts.pct || y0 >= 0 ? '' : `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#9aa4b2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}${zero}${paths}</svg>` + legend(series.map((s, k) => [s.name, s.color || PAL[k]]));
}
function legend(items) { return `<div class="legend">${items.map(([n, c]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`; }

/* data: [[label, value]] */
function donut(data, opts = {}) {
  data = data.filter(d => d[1] > 0).sort((a, b) => b[1] - a[1]);
  const tot = data.reduce((a, d) => a + d[1], 0);
  if (!tot) return emptyChart(opts.empty);
  const R = 80, r = 52, C = 100; let a0 = -Math.PI / 2, out = '';
  data.forEach(([, v], k) => {
    const a1 = a0 + 2 * Math.PI * v / tot, big = a1 - a0 > Math.PI ? 1 : 0, c = opts.colors?.[k] || PAL[k % PAL.length];
    if (data.length === 1) { out += `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="${c}" stroke-width="${R - r}"/>`; }
    else { const p = (ang, rad) => `${(C + rad * Math.cos(ang)).toFixed(2)},${(C + rad * Math.sin(ang)).toFixed(2)}`;
      out += `<path d="M${p(a0, R)}A${R},${R} 0 ${big} 1 ${p(a1, R)}L${p(a1, r)}A${r},${r} 0 ${big} 0 ${p(a0, r)}Z" fill="${c}"/>`; }
    a0 = a1; });
  const center = opts.center ? `<text x="${C}" y="${C - 2}" text-anchor="middle" class="dc1">${esc(opts.center[0])}</text><text x="${C}" y="${C + 16}" text-anchor="middle" class="dc2">${esc(opts.center[1])}</text>` : '';
  const leg = data.map(([n, v], k) => `<div class="dl"><i style="background:${opts.colors?.[k] || PAL[k % PAL.length]}"></i><span>${esc(n)}</span><b>${(v / tot * 100).toFixed(1).replace('.', ',')}%</b></div>`).join('');
  return `<div class="donut"><svg viewBox="0 0 200 200">${out}${center}</svg><div class="dlegend">${leg}</div></div>`;
}

/* bars: labels[], series:[{name,color,values[]}], opts {h, fmt, horizontal} */
function barChart(labels, series, opts = {}) {
  const all = series.flatMap(s => s.values);
  if (!all.some(v => v)) return emptyChart(opts.empty);
  const W = 640, H = opts.h || 230, L = 58, R = 12, T = 12, B = 30;
  let y0 = Math.min(0, ...all), y1 = Math.max(0, ...all); const ticks = niceTicks(y0, y1); y0 = ticks[0]; y1 = ticks[ticks.length - 1];
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const n = labels.length, gw = (W - L - R) / n, bw = Math.min(28, gw * 0.7 / series.length);
  const f = opts.fmt || fmtShort;
  let g = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 6}" y="${Y(v) + 4}" class="ax" text-anchor="end">${f(v)}</text>`).join('');
  labels.forEach((lb, i) => { const cx = L + gw * (i + 0.5);
    g += `<text x="${cx}" y="${H - 10}" class="ax" text-anchor="middle">${esc(String(lb).slice(0, 12))}</text>`;
    series.forEach((s, k) => { const v = s.values[i] || 0, x = cx - bw * series.length / 2 + k * bw, y = Y(Math.max(v, 0)), h = Math.abs(Y(v) - Y(0));
      const col = opts.signColors ? (v >= 0 ? '#26A69A' : '#EF5350') : (s.color || PAL[k]);
      g += `<rect x="${x + 1}" y="${y}" width="${bw - 2}" height="${Math.max(h, v ? 1 : 0)}" rx="3" fill="${col}"><title>${esc(lb)}: ${esc(f(v))}</title></rect>`; }); });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>` + (series.length > 1 ? legend(series.map((s, k) => [s.name, s.color || PAL[k]])) : '');
}

      ...Object.entries(u.kursy || {}).map(([k, v]) => ({ klucz: 'kurs_' + k, wartosc: v }))];
  } else list = S[name] || [];
  const cell = (k, v) => { if (k === 'cenaAuto') return ''; v = v ?? ''; if (typeof v === 'string' && !['id', 'miesiac', 'data', 'dataCeny', 'klucz', 'ticker', 'nazwa'].includes(k) && /^-?\d+(\.\d+)?$/.test(v.trim())) return Number(v); return v; };
  return [T.cols.map(c => c[1]), ...list.map(o => T.cols.map(([k]) => cell(k, o[k])))];
}
function fromRows(name, rows) {
  const T = TABLES[name]; if (!rows || !rows.length) return null;
  const head = rows[0].map(h => String(h).trim());
  const idx = T.cols.map(([k, lab]) => head.indexOf(lab));
  const objs = rows.slice(1).filter(r => r.some(v => v !== '' && v !== null)).map(r => {
    const o = {}; T.cols.forEach(([k], i) => { let v = idx[i] >= 0 ? r[idx[i]] : ''; if (v === undefined || v === null) v = '';
      if ((k === 'data' || k === 'dataCeny') && typeof v === 'number') v = new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
      o[k] = v; });
    if ('id' in o && !o.id) o.id = uid();
    return o; });
  if (name === 'ustawienia') {
    const u = { kursy: {}, kursyData: '', stawka: 19 };
    objs.forEach(o => { if (o.klucz === 'stawka') u.stawka = num(o.wartosc) || 19; else if (o.klucz === 'kursyData') u.kursyData = String(o.wartosc);
      else if (String(o.klucz).startsWith('kurs_')) u.kursy[o.klucz.slice(5)] = o.wartosc; });
    return u;
  }
  return objs;
}

/* ---------- formuła ceny w arkuszu ----------
   YAHOO:GC=F  -> =YAHOO("GC=F|<data>")  (funkcja ze skryptu Portfel_Ceny.gs; data po „|” wymusza odświeżenie raz dziennie)
   =COKOLWIEK  -> wpisane wprost jako formuła
   inne        -> =GOOGLEFINANCE("SYMBOL") */
function priceFormula(sym, day) {
  sym = String(sym || '').trim(); if (!sym) return '';
  if (sym.startsWith('=')) return sym;
  if (/^YAHOO:/i.test(sym)) return `=YAHOO("${sym.slice(6).replace(/"/g, '')}|${day}")`;   // jeden argument – bez separatora
  return `=GOOGLEFINANCE("${sym.replace(/"/g, '')}")`;
}

/* ---------- Google: logowanie ---------- */
// arkusz utworzony przez aplikację -> drive.file (dostęp tylko do niego); własny arkusz użytkownika -> spreadsheets
const scopeNow = () => (CFG.sheetId && !CFG.createdByApp) ? 'https://www.googleapis.com/auth/spreadsheets' : 'https://www.googleapis.com/auth/drive.file';
let tokenClient = null;
function setSync(state, msg) { SYNC.state = state; SYNC.msg = msg; if (typeof renderSyncBadge === 'function') renderSyncBadge(); }
function loadGis() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => res(); s.onerror = () => rej(new Error('Nie udało się wczytać logowania Google (brak internetu lub blokada).'));
    document.head.appendChild(s);
  });
}
async function googleConnect(interactive = true) {
  if (!CFG.clientId) { setSync('local', 'Wpisz Client ID w Ustawieniach, aby połączyć z Google'); return false; }
  try { await loadGis(); } catch (e) { setSync('error', e.message); return false; }
  return new Promise(resolve => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CFG.clientId, scope: scopeNow(),
      callback: async (resp) => {
        if (resp.error) { setSync('error', 'Logowanie przerwane: ' + resp.error); return resolve(false); }
        SYNC.token = resp.access_token; SYNC.exp = Date.now() + (resp.expires_in - 60) * 1000;
        CFG.connected = true; saveCfg();
        try { await afterLogin(); resolve(true); } catch (e) { setSync('error', 'Błąd synchronizacji: ' + e.message); resolve(false); }
      },
      error_callback: (e) => { setSync('error', 'Logowanie Google: ' + (e.message || e.type)); resolve(false); },
    });
    tokenClient.requestAccessToken({ prompt: interactive && !CFG.connectedOnce ? 'consent' : '' });
  });
}
function googleDisconnect() {
  try { if (SYNC.token && window.google) google.accounts.oauth2.revoke(SYNC.token, () => {}); } catch (e) {}
  SYNC.token = null; CFG.connected = false; saveCfg(); setSync('local', 'Rozłączono – dane tylko w tej przeglądarce');
}
async function ensureToken() { return !!(SYNC.token && Date.now() < SYNC.exp); }
async function gapi(method, url, body) {
  const r = await fetch(url, { method, headers: { Authorization: 'Bearer ' + SYNC.token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { SYNC.token = null; throw new Error('Sesja Google wygasła – zaloguj się ponownie'); }
  if (!r.ok) { let t = ''; try { t = (await r.json()).error.message; } catch (e) {} throw new Error(`Google API ${r.status} ${t}`); }
  return r.json();
}
const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets';

async function createSpreadsheet() {
  const res = await gapi('POST', SHEETS, { properties: { title: 'Portfel – dane' },
    sheets: Object.values(TABLES).map(t => ({ properties: { title: t.sheet, gridProperties: { frozenRowCount: 1 } } })) });
  CFG.sheetId = res.spreadsheetId; CFG.sheetUrl = res.spreadsheetUrl; CFG.createdByApp = true; saveCfg();
  // nagłówki pogrubione

    cell: { userEnteredFormat: { textFormat: { bold: true }, backgroundColor: { red: .9, green: .93, blue: .98 } } }, fields: 'userEnteredFormat(textFormat,backgroundColor)' } }));

}
async function ensureSheets() {
  const meta = await gapi('GET', `${SHEETS}/${CFG.sheetId}?fields=sheets.properties.title,spreadsheetUrl`);
  CFG.sheetUrl = meta.spreadsheetUrl; saveCfg();
  const have = new Set(meta.sheets.map(s => s.properties.title));

async function afterLogin() {
  setSync('busy', 'Łączenie z arkuszem…');

  const missing = await ensureSheets();
  if (fresh) { Object.keys(TABLES).forEach(t => DIRTY.add(t)); }
  else {
    await pullAll();
    missing.forEach(t => DIRTY.add(t));
  }
  CFG.connectedOnce = true; saveCfg();
  if (CFG.priceDay !== todayStr()) DIRTY.add('instrumenty');
  await pushDirty();

}
async function pullAll() {
  const names = Object.keys(TABLES).filter(n => !DIRTY.has(n));   // lokalne niezapisane zmiany mają pierwszeństwo
  if (!names.length) return;
  const q = names.map(n => 'ranges=' + encodeURIComponent(`'${TABLES[n].sheet}'!A1:Z5000`)).join('&');
  const res = await gapi('GET', `${SHEETS}/${CFG.sheetId}/values:batchGet?${q}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`);
  let any = false;
  res.valueRanges.forEach((vr, i) => {
    const name = names[i], rows = vr.values || [];
    if (rows.length <= 1 && name !== 'ustawienia') { if ((S[name] || []).length) DIRTY.add(name); return; }  // pusty arkusz -> wyślij lokalne
    const data = fromRows(name, rows); if (!data) return;
    if (name === 'ustawienia') { S.ustawienia = Object.assign(S.ustawienia, data, { kursy: Object.assign({}, S.ustawienia.kursy, data.kursy) }); }
    else if (name === 'instrumenty') {
      S.instrumenty = data.map(o => { const c = String(o.cenaAuto); o.cenaAuto = typeof o.cenaAuto === 'number' ? o.cenaAuto : ''; return o; });
    } else S[name] = data;
    if (name === 'cele') S.cele.forEach(c => { if (c.konto === undefined || c.konto === null) c.konto = ''; if (!c.tickery) c.tickery = c.koszyk; });
    any = true;
  });
  saveLocal();
  if (any && typeof render === 'function') render();
}
async function pushDirty() {
  if (!CFG.sheetId || !DIRTY.size) { setSync('ok', 'Zapisano w Google Sheets ✓'); return; }
  if (SYNC.busy) return; SYNC.busy = true;
  const names = [...DIRTY];
  try {
    setSync('busy', 'Zapisywanie w Google Sheets…');
    await gapi('POST', `${SHEETS}/${CFG.sheetId}/values:batchClear`, { ranges: names.map(n => `'${TABLES[n].sheet}'!A1:Z5000`) });
    await gapi('POST', `${SHEETS}/${CFG.sheetId}/values:batchUpdate`, { valueInputOption: 'RAW',
      data: names.map(n => ({ range: `'${TABLES[n].sheet}'!A1`, values: toRows(n) })) });
    if (names.includes('instrumenty')) {
      const ci = TABLES.instrumenty.cols.findIndex(c => c[0] === 'cenaAuto'), col = String.fromCharCode(65 + ci);
      const day = todayStr();
      const vals = S.instrumenty.map(i => [priceFormula(i.symbol, day)]);
      CFG.priceDay = day; saveCfg();
      if (vals.length) await gapi('POST', `${SHEETS}/${CFG.sheetId}/values:batchUpdate`, { valueInputOption: 'USER_ENTERED', data: [{ range: `'Instrumenty'!${col}2`, values: vals }] });
    }
    names.forEach(n => DIRTY.delete(n)); saveLocal();
    try { await buildSummary(false); } catch (e) { console.warn('Podsumowanie:', e); }
    setSync('ok', 'Zapisano w Google Sheets ✓ ' + new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    setSync('error', e.message + ' – zmiany czekają w przeglądarce');
  } finally { SYNC.busy = false; }
}
function scheduleSync() {
  if (!CFG.sheetId || !CFG.connected) { setSync('local', DIRTY.size && CFG.sheetId ? `${DIRTY.size} tabel czeka na wysłanie – połącz z Google` : 'Dane tylko w tej przeglądarce'); return; }
  clearTimeout(SYNC.timer);
  setSync('pending', 'Zmiany czekają na zapis…');

}
async function syncNow() {
  if (!CFG.clientId) { go('ustawienia'); return; }
  if (!SYNC.token || Date.now() > SYNC.exp) { await googleConnect(true); return; }

async function refreshAutoPrices() {

/* ---------- zakładka „Podsumowanie” w arkuszu (formuły – działa bez aplikacji) ---------- */
async function detectSep() {
  CFG.sep = CFG.sep || {}; if (CFG.sep[CFG.sheetId]) return CFG.sep[CFG.sheetId];
  try { await gapi('POST', `${SHEETS}/${CFG.sheetId}:batchUpdate`, { requests: [{ addSheet: { properties: { title: 'Szukaj' } } }] }); } catch (e) {}
  await gapi('PUT', `${SHEETS}/${CFG.sheetId}/values/${encodeURIComponent("'Szukaj'!Z1")}?valueInputOption=USER_ENTERED`, { values: [['=SUM(1,2)']] });
  const r = await gapi('GET', `${SHEETS}/${CFG.sheetId}/values/${encodeURIComponent("'Szukaj'!Z1")}?valueRenderOption=UNFORMATTED_VALUE`);
  const sep = (r.values && r.values[0] && r.values[0][0] === 3) ? ',' : ';';
  CFG.sep[CFG.sheetId] = sep; saveCfg(); return sep;
}
function summarySig() {
  const pairs = [...new Set(S.transakcje.map(t => t.strategia + '|' + t.ticker))].sort();
  return JSON.stringify([pairs, S.strategie.map(s => s.nazwa), S.konta.map(k => k.nazwa), S.instrumenty.map(i => i.ticker), S.cele.map(c => [c.konto, c.koszyk, c.tickery, c.cel]), 4]);
}
async function buildSummary(force) {
  if (!CFG.sheetId || !SYNC.token) return;
  const sig = summarySig(); if (!force && CFG.sumSig && CFG.sumSig[CFG.sheetId] === sig) return;
  const SEP = await detectSep();
  const f = x => x.replace(/§/g, SEP);
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const pairs = [...new Set(S.transakcje.filter(t => t.strategia && t.ticker).map(t => t.strategia + '|' + t.ticker))].sort().map(p => p.split('|'));
  const strat = S.strategie.map(s => s.nazwa), konta = S.konta, instr = S.instrumenty.filter(i => i.ticker);
  const N = 3000, T = (c) => `Transakcje!$${c}$2:$${c}$${N}`;
  const kursF = cur => `IF(${cur}="PLN"§1§IFERROR(VALUE(INDEX(Ustawienia!$B:$B§MATCH("kurs_"&${cur}§Ustawienia!$A:$A§0)))§0))`;
  // --- pomocnicza tabela strategia × instrument (kolumny T:AC) ---
  const H0 = 2, HL = Math.max(H0, H0 + pairs.length - 1);
  const help = [['Strategia', 'Ticker', 'Ilość', 'Cena', 'Kurs', 'Waluta', 'Wartość PLN', 'Koszt PLN', 'Konto', 'Klasa']];
  pairs.forEach(([st, tk], i) => { const r = H0 + i, m = `MATCH($U${r}§Instrumenty!$B:$B§0)`;
    help.push([st, tk,
      f(`=SUMIFS(Transakcje!$F:$F§Transakcje!$C:$C§$T${r}§Transakcje!$E:$E§$U${r}§Transakcje!$D:$D§"KUPNO")-SUMIFS(Transakcje!$F:$F§Transakcje!$C:$C§$T${r}§Transakcje!$E:$E§$U${r}§Transakcje!$D:$D§"SPRZEDAŻ")`),
      f(`=IFERROR(IF(INDEX(Instrumenty!$F:$F§${m})<>""§INDEX(Instrumenty!$F:$F§${m})§INDEX(Instrumenty!$I:$I§${m}))§0)`),
      f('=' + kursF(`$Y${r}`)),
      f(`=IFERROR(INDEX(Instrumenty!$E:$E§${m})§"PLN")`),
      f(`=IFERROR($V${r}*$W${r}*$X${r}§0)`),
      f(`=IFERROR(IF(SUMIFS(Transakcje!$F:$F§Transakcje!$C:$C§$T${r}§Transakcje!$E:$E§$U${r}§Transakcje!$D:$D§"KUPNO")=0§0§SUMPRODUCT((${T('C')}=$T${r})*(${T('E')}=$U${r})*(${T('D')}="KUPNO")*(${T('F')}*${T('G')}+${T('H')})*IF($Y${r}="PLN"§1§${T('I')}+(${T('I')}="")*$X${r}))*$V${r}/SUMIFS(Transakcje!$F:$F§Transakcje!$C:$C§$T${r}§Transakcje!$E:$E§$U${r}§Transakcje!$D:$D§"KUPNO"))§0)`),
      f(`=IFERROR(INDEX(Strategie!$C:$C§MATCH($T${r}§Strategie!$B:$B§0))§"")`),
      f(`=IFERROR(INDEX(Instrumenty!$D:$D§${m})§"Inne")`)]); });
  const HR = (c) => `$${c}$${H0}:$${c}$${HL}`;
  // --- część widoczna (kolumny B:I) ---

    .forEach(([l, v], k) => { put(4, 2 + k * 2, l); put(5, 2 + k * 2, v); });
  put(6, 2, f(`=IFERROR("≈ "&TEXT(B5/${kursF('"USD"')}§"# ##0")&" USD"§"")`));

    put(r, 6, f(`=SUMIF(${HR('U')}§B${r}§${HR('Z')})`)); put(r, 7, f(`=IF(${VAL}=0§""§F${r}/${VAL})`)); });

    { values: [[`=YAHOO_SZUKAJ("${safe}|${Date.now()}")`]] });

}

/* ---------- inflacja PL i USA (FRED: HICP Polska z Eurostatu, CPI-U USA z BLS) ---------- */
const INFL_SRC = {
  PL: { fred: 'CP0000PLM086NEST', label: 'Eurostat HICP (Polska)' },
  US: { fred: 'CPIAUCNS', label: 'BLS CPI-U (USA)' },
};
function mmFromIndex(pts) {   // pts: [['RRRR-MM', indeks]] -> [['RRRR-MM', zmiana m/m %]]
  pts = pts.filter(x => typeof x[1] === 'number' && isFinite(x[1]) && /^\d{4}-\d{2}$/.test(x[0])).sort((a, b) => a[0].localeCompare(b[0]));
  const out = []; for (let i = 1; i < pts.length; i++) out.push([pts[i][0], Math.round((pts[i][1] / pts[i - 1][1] - 1) * 10000) / 100]);
  return out;
}
async function fredBrowser(id) {
  const r = await fetch('https://fred.stlouisfed.org/graph/fredgraph.csv?id=' + id);
  if (!r.ok) throw new Error('FRED ' + r.status);
  return (await r.text()).trim().split(/\r?\n/).slice(1).map(l => { const [d, v] = l.split(','); return [String(d).slice(0, 7), parseFloat(v)]; });
}
async function fredViaSheet(id) {   // zapasowo przez arkusz (gdy przeglądarka blokuje zapytanie)
  if (!CFG.sheetId || !SYNC.token || Date.now() > SYNC.exp) throw new Error('połącz z Google Sheets');
  try { await gapi('POST', `${SHEETS}/${CFG.sheetId}:batchUpdate`, { requests: [{ addSheet: { properties: { title: 'Szukaj' } } }] }); } catch (e) {}
  await gapi('PUT', `${SHEETS}/${CFG.sheetId}/values/${encodeURIComponent("'Szukaj'!H1")}?valueInputOption=USER_ENTERED`, { values: [[`=DANE_FRED("${id}|${Date.now()}")`]] });
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 1500));
    const res = await gapi('GET', `${SHEETS}/${CFG.sheetId}/values/${encodeURIComponent("'Szukaj'!H1:I700")}?valueRenderOption=UNFORMATTED_VALUE`);
    const rows = res.values || []; const f = rows[0] && rows[0][0];
    if (f === undefined || f === '' || /Loading|Wczytywanie/i.test(String(f))) continue;
    if (String(f).startsWith('#')) throw new Error('brak funkcji DANE_FRED – wklej aktualny skrypt Portfel_Ceny.gs');
    return rows.map(r => [String(r[0]).slice(0, 7), typeof r[1] === 'number' ? r[1] : parseFloat(r[1])]);
  }
  throw new Error('przekroczono czas');
}
async function pobierzInflacje(quiet) {
  const got = {}, errs = [];
  for (const [k, src] of Object.entries(INFL_SRC)) {
    let pts = null;
    try { pts = await fredBrowser(src.fred); } catch (e) { try { pts = await fredViaSheet(src.fred); } catch (e2) { errs.push(k + ': ' + e2.message); } }
    if (pts) got[k] = mmFromIndex(pts).filter(([m]) => m >= '2015-01');
  }
  if (!got.PL && !got.US) { if (!quiet) throw new Error('Nie udało się pobrać inflacji (' + errs.join('; ') + ')'); return null; }
  const map = {}; S.inflacja.forEach(r => map[r.miesiac] = r);
  (got.PL || []).forEach(([m, v]) => { (map[m] = map[m] || { miesiac: m, mm: '', mmUS: '' }).mm = v; });
  (got.US || []).forEach(([m, v]) => { (map[m] = map[m] || { miesiac: m, mm: '', mmUS: '' }).mmUS = v; });
  S.inflacja = Object.values(map).sort((a, b) => a.miesiac.localeCompare(b.miesiac));
  CFG.inflDay = todayStr(); CFG.inflSrc = 'fred'; saveCfg(); changed('inflacja');
  return { pl: (got.PL || []).slice(-1)[0], us: (got.US || []).slice(-1)[0], errs };
}

/* ---------- NBP ---------- */
const NBP_CACHE = lsGet(LS_NBP, {});
async function nbpRate(cur, dateStr) {
  if (!cur || cur === 'PLN' || !dateStr) return 1;
  const key = cur + '|' + dateStr; if (NBP_CACHE[key]) return NBP_CACHE[key];
  const d = new Date(dateStr + 'T12:00:00'); d.setDate(d.getDate() - 1); const end = d.toISOString().slice(0, 10);
  d.setDate(d.getDate() - 12); const start = d.toISOString().slice(0, 10);
  const r = await fetch(`https://api.nbp.pl/api/exchangerates/rates/a/${cur.toLowerCase()}/${start}/${end}/?format=json`);
  if (!r.ok) throw new Error('NBP nie zwrócił kursu ' + cur + ' dla ' + dateStr);
  const j = await r.json(); const mid = j.rates[j.rates.length - 1].mid;
  NBP_CACHE[key] = mid; lsSet(LS_NBP, NBP_CACHE); return mid;
}
async function nbpCurrent() {
  const r = await fetch('https://api.nbp.pl/api/exchangerates/tables/a/?format=json');
  if (!r.ok) throw new Error('NBP niedostępny');
  const t = (await r.json())[0]; const m = {}; t.rates.forEach(x => m[x.code] = x.mid);
  Object.keys(S.ustawienia.kursy).forEach(c => { if (m[c]) S.ustawienia.kursy[c] = m[c]; });
  S.ustawienia.kursyData = t.effectiveDate; changed('ustawienia');
  return t.effectiveDate;
}

/* ---------- historia: dzienny zapis wartości ---------- */
const LS_INTRA = 'portfel_intraday_v1';
function snapshotIntraday() {
  if (!C || C.wartosc <= 0) return;
  const arr = lsGet(LS_INTRA, []), now = new Date(), last = arr[arr.length - 1];
  const w = Math.round(C.wartosc * 100) / 100, k = Math.round(C.kapital * 100) / 100;
  if (last && now - new Date(last.t) < 10 * 60000) { if (last.w === w && last.k === k) return; last.w = w; last.k = k; last.t = now.toISOString(); }
  else arr.push({ t: now.toISOString(), w, k });
  const cut = Date.now() - 3 * 864e5; lsSet(LS_INTRA, arr.filter(p => new Date(p.t).getTime() > cut));
}
function snapshot() {
  snapshotIntraday();
  if (!C || C.wartosc <= 0) return;
  const d = todayStr(), last = S.historia[S.historia.length - 1];
  const rec = { data: d, wartosc: Math.round(C.wartosc * 100) / 100, kapital: Math.round(C.kapital * 100) / 100 };
  if (last && last.data === d) { if (Math.abs(num(last.wartosc) - rec.wartosc) < 0.01 && Math.abs(num(last.kapital) - rec.kapital) < 0.01) return; Object.assign(last, rec); }
  else S.historia.push(rec);
  S.historia.sort((a, b) => String(a.data).localeCompare(String(b.data)));
  changed('historia');
}

  if (noPrice.length) w.push(`Brak ceny dla: <b>${noPrice.map(esc).join(', ')}</b> – uzupełnij w <a onclick="go('instrumenty')">Instrumenty i ceny</a>.`);
  const needFx = C.pozycje.some(p => p.waluta !== 'PLN') && !num(S.ustawienia.kursy.USD);
  if (needFx) w.push(`Brak bieżących kursów walut – <a onclick="pobierzKursy()">pobierz z NBP</a> lub wpisz w Ustawieniach.`);
  return w.length ? `<div class="alert">⚠ ${w.join('<br>⚠ ')}</div>` : '';
}
function histSeries() {
  if (RANGE === '1d') {
    const from = Date.now() - 864e5;
    let h = lsGet(LS_INTRA, []).filter(p => new Date(p.t).getTime() >= from).map(p => ({ d: localIso(p.t), w: p.w, k: p.k }));
    if (h.length < 2) { const d = S.historia.filter(x => x.data && has(x.wartosc)).slice(-2).map(x => ({ d: String(x.data).slice(0, 10), w: num(x.wartosc), k: num(x.kapital) })); if (d.length === 2) h = d; }
    return h;
  }
  let h = S.historia.filter(x => x.data && has(x.wartosc)).map(x => ({ d: String(x.data).slice(0, 10), w: num(x.wartosc), k: num(x.kapital) }));
  if (RANGE !== 'all' && h.length) { const days = { '1w': 7, '1m': 31, '3m': 92, '1r': 366, 'ytd': 0 }[RANGE];
    const from = RANGE === 'ytd' ? new Date().getFullYear() + '-01-01' : new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
    h = h.filter(x => x.d >= from); }
  return h;
}
const localIso = t => { const d = new Date(t); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
function emptyMsg() { return { '1d': 'Wykres dzienny pojawi się po kilku aktualizacjach w ciągu dnia (otwórz aplikację ponownie za jakiś czas)', '1w': 'Wykres tygodniowy pojawi się po co najmniej dwóch dniach zapisów' }[RANGE] || 'Wykres pojawi się po kilku dniach zapisów historii'; }
function rangeSeg() { return `<div class="seg">${[['1d', '1D'], ['1w', '1T'], ['1m', '1M'], ['3m', '3M'], ['ytd', 'YTD'], ['1r', '1R'], ['all', 'Całość']].map(([k, l]) => `<button class="${RANGE === k ? 'on' : ''}" onclick="RANGE='${k}';render()">${l}</button>`).join('')}</div>`; }

    ${kpi('Wpłacony kapitał', zl(C.kapital, 0), `po inflacji: ${zl(C.kapitalRealny, 0)}`)}

    ${kpi('Zmiana od ostatniego zapisu', zmiana === null ? '–' : pl(zmiana), prev ? 'vs ' + prev.data + ' (bez wpłat)' : 'historia zapisuje się codziennie')}
  </div>`;
  const short = ['1d', '1w', '1m'].includes(RANGE);
  const line = lineChart([
    { name: 'Wartość portfela', points: h.map(x => [x.d, x.w]) },
    ...(short ? [] : [{ name: 'Wpłacony kapitał', points: h.map(x => [x.d, x.k]), color: '#94a3b8', dash: true },
    { name: 'Kapitał po inflacji', points: h.map(x => [x.d, C.kapitalRealnyNa(x.d.slice(0, 10))]), color: '#F9A825', dash: true }]),
  ], { area: true, empty: emptyMsg(), zero: !['1d', '1w', '1m'].includes(RANGE) });
  const ret = lineChart([
    { name: 'Stopa zwrotu', points: h.filter(x => x.k).map(x => [x.d, (x.w - x.k) / x.k]) },
    { name: 'Realna (po inflacji)', points: h.filter(x => x.k).map(x => { const kr = C.kapitalRealnyNa(x.d.slice(0, 10)); return [x.d, kr ? (x.w - kr) / kr : 0]; }), color: '#7E57C2' },
  ], { pct: true, h: 200, empty: emptyMsg() });
  const klasy = donut(Object.entries(C.klasy), { center: [nf0.format(C.wartosc / 1000) + ' tys.', 'PLN'], empty: 'Dodaj pierwszą transakcję' });
  const waluty = donut(Object.entries(C.waluty), { empty: 'Brak pozycji' });
  const strat = C.strategie.filter(s => s.wartosc || s.zrealizowany || s.dywidendyNetto);
  const stratTbl = table([
    { h: 'Strategia', f: s => `<span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${esc(s.kolor)};margin-right:7px"></span>${esc(s.nazwa)}` },
    { h: 'Wartość', n: 1, f: s => zl(s.wartosc, 0) },
    { h: 'Udział', f: s => `<div class="bar"><i style="width:${(s.udzial * 100).toFixed(1)}%;background:${esc(s.kolor)}"></i></div>` },
    { h: 'Wynik', n: 1, f: s => pl(s.wynik) }, { h: '%', n: 1, f: s => pp(s.koszt ? s.wynik / s.koszt : 0) },
  ], strat, { empty: 'Brak pozycji w strategiach', click: s => `go('strategia','${s.id}')` });
  const modele = [['', 'Cały portfel'], ...S.konta.filter(k => S.cele.some(c => c.konto === k.nazwa)).map(k => [k.nazwa, k.nazwa])];
  if (!modele.some(m => m[0] === (FILT.model || ''))) FILT.model = '';
  const modelSel = modele.length > 1 ? `<select style="padding:4px 8px;font-size:12.5px" onchange="FILT.model=this.value;render()">${modele.map(([v, l]) => `<option value="${esc(v)}" ${v === (FILT.model || '') ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>` : '';
  const months = ['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'];
  const dm = months.map((_, i) => dywRok.filter(d => +d.data.slice(5, 7) === i + 1).reduce((a, d) => a + d.nettoPLN, 0));
  const top = C.pozycje.slice().sort((a, b) => b.wartoscPLN - a.wartoscPLN).slice(0, 8);
  const topTbl = table([
    { h: 'Instrument', f: p => `<b>${esc(p.ticker)}</b> <span class="mut">${esc(p.strategia)}</span>` },
    { h: 'Wartość', n: 1, f: p => zl(p.wartoscPLN, 0) }, { h: 'Udział', n: 1, f: p => pct(C.wartosc ? p.wartoscPLN / C.wartosc : 0) },
    { h: 'Zysk', n: 1, f: p => pl(p.zyskPLN) }, { h: '%', n: 1, f: p => pp(p.kosztPLN ? p.zyskPLN / p.kosztPLN : 0) },
  ], top, { empty: 'Brak otwartych pozycji', click: p => `go('portfel')` });
  const sub = `Stan na ${new Date().toLocaleDateString('pl-PL')}${kursUsd ? ' · USD/PLN ' + kursUsd.toFixed(4).replace('.', ',') : ''}${S.ustawienia.kursyData ? ' (NBP ' + S.ustawienia.kursyData + ')' : ''}`;
  const intro = !S.transakcje.length ? `<div class="alert info">👋 Zacznij od <a onclick="go('ustawienia')">Ustawień</a> (konta, połączenie z Google), potem dodaj <a onclick="editTransakcja()">pierwszą transakcję</a>. Ceny aktualizujesz w <a onclick="go('instrumenty')">Instrumentach</a>.</div>` : '';
  return ['Kokpit', sub, intro + warningsBox() + kp + `
    <div class="grid g2"><div class="card"><h3>Wartość portfela w czasie<span class="sp"></span>${rangeSeg()}</h3>${line}</div>
      <div class="card"><h3>Struktura – klasy aktywów</h3>${klasy}</div></div>
    <div class="grid g2" style="margin-top:16px"><div class="card"><h3>Stopa zwrotu: nominalna i realna<span class="sp"></span>${rangeSeg()}</h3>${ret}</div>
      <div class="card"><h3>Ekspozycja walutowa</h3>${waluty}</div></div>
    <div class="card" style="margin-top:16px"><h3>Konta<span class="sp"></span><button class="btn sm ghost" onclick="editKonto()">＋ Konto</button></h3>${table([
      { h: 'Konto', f: k => `<b>${esc(k.nazwa)}</b>` }, { h: 'Typ', f: k => `<span class="tag">${esc(k.typ)}</span>` },

      { h: 'Wpłacono', n: 1, f: k => zl(k.kapital, 0) }, { h: 'Zysk', n: 1, f: k => k.zysk === null ? '–' : pl(k.zysk) }, { h: '%', n: 1, f: k => k.zyskPct === null ? '–' : pp(k.zyskPct) },

      <div class="card"><h3>Portfel docelowy<span class="sp"></span>${modelSel}</h3>${modelCard(FILT.model || '')}</div></div>
    <div class="grid g2e" style="margin-top:16px"><div class="card"><h3>Dywidendy i odsetki ${rok} <small>netto PLN</small></h3>${barChart(months, [{ name: 'Netto', values: dm, color: '#26A69A' }], { empty: 'Brak dywidend w tym roku', h: 200 })}</div>
      <div class="card"><h3>Największe pozycje</h3>${topTbl}</div></div>`];
}

function vInflacja() {
  const rows = S.inflacja.slice().sort((a, b) => String(b.miesiac).localeCompare(String(a.miesiac)));

  const yoy = key => asc.map((r, i) => { if (i < 11) return null; const w = asc.slice(i - 11, i + 1); if (w.some(x => !has(x[key]))) return null;
    return [r.miesiac + '-01', w.reduce((a, x) => a * (1 + num(x[key]) / 100), 1) - 1]; }).filter(Boolean);
  const yPL = yoy('mm'), yUS = yoy('mmUS');
  const lastPL = yPL[yPL.length - 1], lastUS = yUS[yUS.length - 1];
  const yoyMap = (arr) => Object.fromEntries(arr.map(([d, v]) => [d.slice(0, 7), v]));
  const mPL = yoyMap(yPL), mUS = yoyMap(yUS);
  return ['Inflacja', `Pobierana automatycznie raz dziennie z FRED · Polska: Eurostat HICP · USA: BLS CPI-U${CFG.inflDay ? ' · aktualizacja ' + esc(CFG.inflDay) : ''}`, `

      ${kpi('Inflacja r/r – USA', lastUS ? pct(lastUS[1]) : '–', lastUS ? lastUS[0].slice(0, 7) : 'brak danych')}

      ${kpi('Zysk realny portfela', pl(C.zyskRealny), pp(C.zyskRealnyPct) + ' ponad inflację PL')}</div>
    <div class="card"><h3>Inflacja r/r: Polska vs USA</h3>${lineChart([{ name: 'Polska', points: yPL, color: '#EF5350' }, { name: 'USA', points: yUS, color: '#1565C0' }], { pct: true, empty: 'Kliknij „Pobierz dane teraz”' })}</div>
    <div style="margin-top:16px"><button class="btn ghost" onclick="FILT.inflTab=!FILT.inflTab;render()">${FILT.inflTab ? '▲ Ukryj dane miesięczne' : '▼ Pokaż dane miesięczne'}</button></div>
    ${!FILT.inflTab ? '' : `<div class="card" style="margin-top:12px"><h3>Dane miesięczne<span class="sp"></span><small>możesz poprawić wartość ręcznie</small></h3>${table([
      { h: 'Miesiąc', f: r => esc(r.miesiac) },
      { h: 'Polska m/m %', n: 1, f: r => `<input class="cell" type="number" step="0.01" value="${esc(r.mm)}" onchange="setInfl('${esc(r.miesiac)}',this.value,'mm')">` },
      { h: 'Polska r/r', n: 1, f: r => mPL[r.miesiac] !== undefined ? pct(mPL[r.miesiac]) : '–' },
      { h: 'USA m/m %', n: 1, f: r => `<input class="cell" type="number" step="0.01" value="${esc(r.mmUS ?? '')}" onchange="setInfl('${esc(r.miesiac)}',this.value,'mmUS')">` },
      { h: 'USA r/r', n: 1, f: r => mUS[r.miesiac] !== undefined ? pct(mUS[r.miesiac]) : '–' },
    ], rows.slice(0, 120), { empty: 'Brak danych – kliknij „Pobierz dane teraz”' })}</div>`}
    <div class="mut" style="font-size:12px;margin-top:10px">Zysk realny liczony jest inflacją polską (portfel wyceniany w PLN). Dla Polski używany jest zharmonizowany wskaźnik HICP z Eurostatu – zwykle różni się od CPI GUS o kilka dziesiątych punktu procentowego. Dane pobierane z FRED (Federal Reserve Bank of St. Louis). Statystyki publikowane są z opóźnieniem ok. 2–6 tygodni, więc ostatni miesiąc zwykle jeszcze nie jest dostępny.</div>`,

function modal(title, fields, vals, onSave, onDelete, pre = '') {
  const f = fields.map(x => {
    const v = vals[x.k] ?? '';
    let inp;
    if (x.t === 'select') inp = `<select name="${x.k}">${x.o.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
    else if (x.t === 'textarea') inp = `<textarea name="${x.k}" rows="2">${esc(v)}</textarea>`;
    else inp = `<input name="${x.k}" type="${x.t || 'text'}" ${x.t === 'number' ? 'step="any"' : ''} value="${esc(v)}" ${x.ph ? `placeholder="${esc(x.ph)}"` : ''}>`;
    return `<label class="${x.full ? 'full' : ''}">${x.l}${inp}${x.help ? `<span class="help" id="help_${x.k}">${x.help}</span>` : ''}</label>`;
  }).join('');
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><h2>${esc(title)}</h2>${pre}<form class="form">${f}</form><div class="actions">${onDelete ? '<button class="btn danger" data-a="del">Usuń</button>' : ''}<span class="sp"></span><button class="btn ghost" data-a="cancel">Anuluj</button><button class="btn" data-a="save">Zapisz</button></div></div>`;
  document.body.appendChild(bg);
  const form = bg.querySelector('form');
  const read = () => { const o = {}; fields.forEach(x => { const el = form.elements[x.k]; let v = el.value.trim(); if (x.t === 'number' && v !== '') v = num(v); o[x.k] = v; }); return o; };
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.querySelector('[data-a=cancel]').onclick = close;
  bg.querySelector('[data-a=save]').onclick = () => { const o = read(); const err = onSave(o); if (err) { toast(err); return; } close(); render(); };
  if (onDelete) bg.querySelector('[data-a=del]').onclick = () => { if (confirm('Usunąć?')) { onDelete(); close(); render(); } };
  form.addEventListener('submit', e => e.preventDefault());
  setTimeout(() => { const first = form.querySelector('input,select'); first && first.focus(); }, 30);
  return form;
}

function guessKlasa(r) {
  const s = r.symbol.toUpperCase(), n = (r.nazwa || '').toLowerCase(), t = r.typ.toUpperCase();
  if (s.startsWith('GC=') || s.startsWith('XAU') || /gold|złot/.test(n)) return 'Złoto';
  if (s.startsWith('SI=') || s.startsWith('XAG') || /silver|srebr/.test(n)) return 'Srebro';
  if (t === 'CRYPTOCURRENCY') return 'Krypto';
  if (/treasury|bond|obligac/.test(n)) return 'Obligacje';
  if (/reit|real estate/.test(n)) return 'Nieruchomości';
  if (t === 'ETF' || t === 'EQUITY' || t === 'MUTUALFUND' || t === 'INDEX') return 'Akcje/ETF';
  return 'Inne';
}
function wireSearch(form, editing) {

    q.value = v; btn.disabled = true; out.innerHTML = '<div class="mut">Szukam w Yahoo Finance… (kilka sekund)</div>';
    try {
      const res = await searchSymbols(v);
      if (!res.length) { out.innerHTML = '<div class="mut">Nic nie znaleziono – wpisz dane i symbol ręcznie poniżej.</div>'; E.ticker.focus(); return; }
      out.innerHTML = res.map((r, k) => `<div class="sr" data-k="${k}"><b>${esc(r.symbol)}</b><span>${esc(r.nazwa)}</span><i>${esc(r.gielda)} · ${esc(r.typ)}${r.waluta ? ' · ' + esc(r.waluta) : ''}${r.cena !== '' ? ' · ' + nf2.format(r.cena) : ''}</i></div>`).join('');
      out.querySelectorAll('.sr').forEach(el => el.onclick = () => {
        const r = res[+el.dataset.k];

        const base = r.symbol.replace(/\.[A-Z]{1,3}$/, '').replace(/=F$/, '').replace(/-USD$/, '');
        const map = { GC: 'ZŁOTO', SI: 'SREBRO' };
        if (!editing || !E.ticker.value) E.ticker.value = map[base] || base;
        E.nazwa.value = ({ GC: 'Złoto (1 oz)', SI: 'Srebro (1 oz)' })[base] || r.nazwa || E.nazwa.value;
        E.klasa.value = guessKlasa(r);
        if (['USD', 'PLN', 'EUR', 'GBP', 'CHF'].includes(r.waluta)) E.waluta.value = r.waluta;
        E.symbol.value = 'YAHOO:' + r.symbol;
        toast('Uzupełniono dane – sprawdź i kliknij Zapisz');
      });
    } catch (e) { out.innerHTML = `<div class="warn">${esc(e.message)}. Możesz wpisać dane ręcznie.</div>`; }
    finally { btn.disabled = false; }
  };
  btn.onclick = run; q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); run(); } });
  if (!SYNC.token) out.innerHTML = '<div class="mut">Wyszukiwanie działa po połączeniu z Google Sheets (plakietka u góry). Bez tego wpisz dane ręcznie.</div>';
}

    if (!o.koszyk) return 'Podaj nazwę koszyka';
    if (!ts.length) return 'Zaznacz co najmniej jeden instrument';
    const inny = S.cele.find(x => x.id !== id && (x.konto || '') === (c.konto || '') && String(x.tickery || x.koszyk).split(',').some(t => ts.includes(t.trim())));
    if (inny) return `Instrument jest już w koszyku „${inny.koszyk}” tego portfela`;
    o.tickery = ts.join(','); o.konto = c.konto || '';
    if (id) Object.assign(c, o); else S.cele.push({ id: uid(), ...o }); changed('cele');
  }, id ? () => { S.cele = S.cele.filter(x => x.id !== id); changed('cele'); } : null,
  pre + `<div class="chk"><div class="mut" style="font-size:12.5px;margin-bottom:6px">Instrumenty w koszyku:</div>${S.instrumenty.map(i => `<label><input type="checkbox" value="${esc(i.ticker)}" ${sel.has(i.ticker) ? 'checked' : ''}> <b>${esc(i.ticker)}</b> <span class="mut">${esc(i.nazwa)}</span></label>`).join('')}</div>`);
}
function kopiujCele(from, to) {
  if (S.cele.some(c => c.konto === to) && !confirm(`Konto ${to} ma już portfel docelowy – zastąpić?`)) return;
  S.cele = S.cele.filter(c => c.konto !== to).concat(S.cele.filter(c => (c.konto || '') === from).map(c => ({ ...c, id: uid(), konto: to })));
  changed('cele'); FILT.celeKonto = to; render(); toast('Skopiowano portfel docelowy do ' + to);
}
function migrateCele() {
  let ch = false;
  S.cele.forEach(c => { if (c.konto === undefined) { c.konto = ''; ch = true; }
    if (!c.tickery) { const ts = S.instrumenty.filter(i => i.koszyk && i.koszyk === c.koszyk).map(i => i.ticker); c.tickery = ts.length ? ts.join(',') : c.koszyk; ch = true; } });
  if (ch) changed('cele');
}
function setCena(id, v) { const i = S.instrumenty.find(x => x.id === id); i.cena = v === '' ? '' : num(v); i.dataCeny = v === '' ? '' : todayStr(); changed('instrumenty'); render(); }
function addInflacja() {
  const last = S.inflacja.map(r => r.miesiac).sort().pop();
  let m; if (last) { const d = new Date(last + '-01T12:00:00'); d.setMonth(d.getMonth() + 1); m = d.toISOString().slice(0, 7); } else { const d = new Date(); d.setMonth(d.getMonth() - 1); m = d.toISOString().slice(0, 7); }
  const v = prompt('Miesiąc (RRRR-MM):', m); if (!v || !/^\d{4}-\d{2}$/.test(v)) return;
  if (!S.inflacja.some(r => r.miesiac === v)) S.inflacja.push({ miesiac: v, mm: '' }); changed('inflacja'); render();
}
function setInfl(m, v, key = 'mm') { const r = S.inflacja.find(x => x.miesiac === m); r[key] = v === '' ? '' : num(v); changed('inflacja'); render(); }
function delInfl(m) { S.inflacja = S.inflacja.filter(x => x.miesiac !== m); changed('inflacja'); render(); }
async function pobierzKursy() { try { const d = await nbpCurrent(); toast('Kursy NBP z ' + d); render(); } catch (e) { toast(e.message); } }

/* ---------- eksport / import ---------- */
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportJSON() { download(`portfel-${todayStr()}.json`, JSON.stringify(S, null, 1), 'application/json'); }
function exportCSV() {
  const cols = TABLES.transakcje.cols; const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [cols.map(c => q(c[1])).join(';'), ...S.transakcje.map(t => cols.map(([k]) => typeof t[k] === 'number' ? String(t[k]).replace('.', ',') : q(t[k])).join(';'))];
  download(`transakcje-${todayStr()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}
function importJSON(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.transakcje || !d.strategie) throw new Error(); if (!confirm('Zastąpić obecne dane danymi z pliku?')) return;
    S = Object.assign(defaultState(), d); Object.keys(TABLES).forEach(t => DIRTY.add(t)); saveLocal(); scheduleSync(); render(); toast('Zaimportowano dane'); }
    catch (e) { toast('To nie jest plik eksportu Portfela'); } };
  r.readAsText(file);
}
function resetAll() { if (!confirm('Usunąć wszystkie dane z tej przeglądarki? (arkusz Google zostaje bez zmian)')) return; S = defaultState(); DIRTY = new Set(); saveLocal(); render(); }

/* ---------- zmiana kolejności przeciąganiem ---------- */
let DRAG = null;
document.addEventListener('dragstart', e => { const el = e.target.closest && e.target.closest('[data-drag]'); if (!el) return;
  DRAG = { list: el.dataset.drag, id: el.dataset.id }; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', el.dataset.id); } catch (x) {} });
document.addEventListener('dragend', e => { DRAG = null; document.querySelectorAll('.dragging,.drop-before,.drop-after').forEach(x => x.classList.remove('dragging', 'drop-before', 'drop-after')); });
document.addEventListener('dragover', e => { if (!DRAG) return; const el = e.target.closest && e.target.closest(`[data-drag="${DRAG.list}"]`); if (!el) return;
  e.preventDefault(); const r = el.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  document.querySelectorAll('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after')); el.classList.add(after ? 'drop-after' : 'drop-before'); });
document.addEventListener('drop', e => { if (!DRAG) return; const el = e.target.closest && e.target.closest(`[data-drag="${DRAG.list}"]`); if (!el) return;
  e.preventDefault(); const r = el.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  const arr = S[DRAG.list], from = arr.findIndex(x => x.id === DRAG.id); if (from < 0 || el.dataset.id === DRAG.id) return;
  const [item] = arr.splice(from, 1); let to = arr.findIndex(x => x.id === el.dataset.id); if (after) to++;
  arr.splice(to, 0, item); changed(DRAG.list); DRAG = null; render(); toast('Zmieniono kolejność'); });

/* ---------- start ---------- */
setInterval(() => { if (document.visibilityState === 'visible') { C = calc(S); snapshotIntraday(); if (ROUTE === 'kokpit' && RANGE === '1d') render(); } }, 15 * 60000);
function boot() {
  const MIG = { 'CURRENCY:XAUUSD': 'YAHOO:GC=F', 'CURRENCY:XAGUSD': 'YAHOO:SI=F', 'CURRENCY:BTCUSD': 'YAHOO:BTC-USD' };
  let mig = false; S.instrumenty.forEach(i => { if (MIG[i.symbol]) { i.symbol = MIG[i.symbol]; mig = true; } }); if (mig) changed('instrumenty');
  migrateCele();
  readHash(); render(); snapshot();
  if (CFG.clientId && CFG.connected) setSync('pending', 'Kliknij tutaj, aby połączyć z Google Sheets');
  else setSync('local', CFG.sheetId ? 'Kliknij, aby połączyć z Google Sheets' : 'Dane tylko w tej przeglądarce');
  if (CFG.inflDay !== todayStr() || CFG.inflSrc !== 'fred') pobierzInflacje(true).then(r => { if (r) { render(); snapshot(); } }).catch(() => {});
  const kd = S.ustawienia.kursyData; if (!kd || kd < todayStr().slice(0, 10) && navigator.onLine) nbpCurrent().then(() => { render(); snapshot(); }).catch(() => {});
}

boot();
</script>
